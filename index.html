<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Calendar Planner</title>
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="icon" type="image/png" href="icon-192.png?v=3">
<script>
/* Apply the saved theme before the page paints, so there's no flash. */
(function(){ try{ var t = (JSON.parse(localStorage.getItem("calendarplanner:prefs"))||{}).theme;
  if(t==="light"||t==="dark"){ document.documentElement.setAttribute("data-theme", t);
    document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){ m.setAttribute("content", t==="dark"?"#000000":"#FFFFFF"); }); }
}catch(e){} })();
</script>
<style>
/* Calendar Planner: styled to match the iPhone, iPad and Mac app.
   System fonts (San Francisco on Apple devices, Segoe UI on Windows), grouped lists,
   glass bars and sheets, and the violet-pink-orange brand gradient. */
:root{
  --bg:#F2F2F7;            /* grouped background (lists) */
  --paper:#FFFFFF;         /* plain background (Day, AI) */
  --surface:#FFFFFF;       /* cells on grouped pages */
  --card:#F2F2F7;          /* cards on plain pages */
  --sheet:#F2F2F7; --sheetcell:#FFFFFF;
  --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.20);
  --ink:#000000; --muted:rgba(60,60,67,.6); --line:rgba(60,60,67,.16);
  --accent:#5B3FE8; --accent-fill:#5B3FE8; --tint:rgba(91,63,232,.12);
  --danger:#FF3B30; --orange:#FF9500; --green:#34C759;
  --glass:rgba(255,255,255,.72); --glass-line:rgba(255,255,255,.6); --shadow:0 8px 30px rgba(0,0,0,.12);
  --violet:#6A4DFF; --pink:#E9407A; --orangeb:#FF8A3D;
  --brand:linear-gradient(135deg,var(--violet),var(--pink) 55%,var(--orangeb));
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,system-ui,sans-serif;
  --display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --paper:#000000; --surface:#1C1C1E; --card:#1C1C1E; --sheet:#1C1C1E; --sheetcell:#2C2C2E;
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
    --ink:#FFFFFF; --muted:rgba(235,235,245,.6); --line:rgba(84,84,88,.55);
    --accent:#A898FF; --accent-fill:#6A4DFF; --tint:rgba(152,134,255,.18);
    --danger:#FF453A; --orange:#FF9F0A; --green:#30D158;
    --glass:rgba(30,30,32,.72); --glass-line:rgba(255,255,255,.08); --shadow:0 8px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --paper:#000000; --surface:#1C1C1E; --card:#1C1C1E; --sheet:#1C1C1E; --sheetcell:#2C2C2E;
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --ink:#FFFFFF; --muted:rgba(235,235,245,.6); --line:rgba(84,84,88,.55);
  --accent:#A898FF; --accent-fill:#6A4DFF; --tint:rgba(152,134,255,.18);
  --danger:#FF453A; --orange:#FF9F0A; --green:#30D158;
  --glass:rgba(30,30,32,.72); --glass-line:rgba(255,255,255,.08); --shadow:0 8px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
/* Grouped pages: gray background, white cells. Day and AI: white background, gray cards. */
body{--page:var(--bg);--cardbg:var(--surface);margin:0;background:var(--page);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body[data-tab="day"],body[data-tab="ai"]{--page:var(--paper);--cardbg:var(--card)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom,0px))}

/* Soft brand colour at the top of the Day page, fading out */
.glow{position:absolute;left:0;right:0;top:0;height:420px;pointer-events:none;z-index:-1;
  background:linear-gradient(135deg,rgba(106,77,255,.20),rgba(233,64,122,.11) 55%,rgba(255,138,61,0) 100%);
  -webkit-mask-image:linear-gradient(#000,rgba(0,0,0,.6) 55%,transparent);mask-image:linear-gradient(#000,rgba(0,0,0,.6) 55%,transparent)}
body:not([data-tab="day"]) .glow{display:none}

/* ---------- Top bar ---------- */
header.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));min-height:60px}
header.top.scrolled{background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);box-shadow:0 1px 0 var(--line)}
.top-left{display:flex;align-items:center;gap:10px;min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;white-space:nowrap}
.brand-mark{width:30px;height:30px;flex:none;display:block;filter:drop-shadow(0 3px 8px rgba(200,60,160,.3))}
.sync-chip{border:0;background:var(--fill);color:var(--muted);font-weight:600;font-size:12px;padding:4px 10px 4px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dotc,var(--green))}
.sync-chip[data-s="pending"],.sync-chip[data-s="syncing"]{--dotc:#FFCC00}
.sync-chip[data-s="offline"]{--dotc:#8E8E93}
.sync-chip[data-s="error"]{--dotc:var(--danger);color:var(--danger)}
.glassbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);box-shadow:var(--shadow);display:grid;place-items:center;padding:0;flex:none}
.glassbtn .plus{width:26px;height:26px;border-radius:50%;background:var(--accent-fill);color:#fff;display:grid;place-items:center}
.glassbtn .plus svg{width:16px;height:16px;stroke-width:3}

/* Add menu */
.menu{position:fixed;z-index:30;top:calc(64px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));min-width:230px;padding:6px;border-radius:18px;
  background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(30px);backdrop-filter:saturate(1.8) blur(30px);border:1px solid var(--glass-line);box-shadow:0 18px 50px rgba(0,0,0,.22);transform-origin:top right;animation:pop .18s ease-out}
.menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:16px;border:0;background:none;padding:11px 12px;border-radius:12px;font-size:17px;text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--fill)}
.menu button svg{color:var(--muted)}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}

/* ---------- Tab bar: floating glass bar at the bottom on phones, centred capsule on wide screens ---------- */
.tabbar{position:fixed;z-index:14;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:5px;border-radius:32px;
  background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;color:var(--ink);font-size:10px;font-weight:600;border-radius:26px;min-width:0;letter-spacing:0}
.tabbar svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--accent);background:var(--fill)}
.tabbar button[aria-selected="true"] svg{stroke-width:2.2}
@media (min-width:900px){
  .tabbar{left:50%;right:auto;bottom:auto;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:999px;z-index:16}
  .tabbar button{flex-direction:row;font-size:15px;font-weight:600;padding:9px 16px;border-radius:999px}
  .tabbar svg{display:none}
  .wrap{padding-bottom:60px}
}

/* ---------- Text ---------- */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:6px 0 14px}
.page-title{font-family:var(--body);font-weight:700;font-size:34px;letter-spacing:.01em;line-height:1.1;margin:0}
.page-sub{margin:4px 0 0;color:var(--muted);font-size:15px}
.eyebrow{margin:0 0 2px;color:var(--accent);font-weight:600;font-size:15px}
.section-label{font-weight:700;font-size:20px;margin:24px 0 8px}
.ghead{display:flex;justify-content:space-between;gap:10px;margin:22px 16px 7px;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:0}
.ghead.today{color:var(--accent)}
.gfoot{margin:7px 16px 0;color:var(--muted);font-size:13px}
.fine{font-size:13px;color:var(--muted)}
.status{font-weight:600;color:var(--ink)!important}
.error{color:var(--danger);font-weight:600;font-size:15px;margin:0}
.tag{font-size:12px;font-weight:600;background:var(--fill);color:var(--muted);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.emoji{font-size:20px;width:22px;text-align:center}

/* ---------- Buttons ---------- */
.btn{border:0;background:var(--tint);color:var(--accent);padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
.btn.primary{background:var(--accent-fill);color:#fff}
.btn.danger{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
a.btn{color:var(--accent)} a.btn.primary{color:#fff}
.round{width:36px;height:36px;padding:0;border-radius:50%}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:none}
.linkbtn.danger{color:var(--danger)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.xbtn{border:0;background:none;color:var(--muted);padding:4px;border-radius:50%;display:grid;place-items:center}
.xbtn:hover{background:var(--fill)}

/* ---------- Inputs ---------- */
input[type=text],input[type=email],input[type=date],input[type=time],input[type=number],select,textarea{border:0;background:var(--fill);border-radius:10px;padding:10px 12px;width:100%;min-width:0;font-size:17px;outline-offset:0}
textarea{min-height:84px;resize:vertical}
::placeholder{color:var(--muted)}
/* Round check circles, filled with the class colour */
.check{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid color-mix(in srgb,var(--muted) 70%,transparent);border-radius:50%;display:grid;place-content:center;background:transparent;flex:none;margin:0;cursor:pointer;transition:background .15s,border-color .15s}
.check:checked{background:var(--c,var(--accent-fill));border-color:var(--c,var(--accent-fill))}
.check:checked::after{content:"";width:10px;height:5.5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.check.sel:checked{background:var(--accent-fill);border-color:var(--accent-fill)}
/* Switches for on/off settings */
.opt{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center;gap:14px;padding:6px 0;cursor:pointer}
.opt input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;margin:0;cursor:pointer;transition:background .2s}
.opt input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.opt input[type=checkbox]:checked{background:var(--accent-fill)}
.opt input[type=checkbox]:checked::after{transform:translateX(20px)}
.opt input[type=radio]{accent-color:var(--accent-fill);width:20px;height:20px}

/* ---------- Grouped lists (like iOS Settings) ---------- */
.glist{background:var(--cardbg);border-radius:22px;overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:48px;position:relative;width:100%;border:0;background:none;text-align:left;color:inherit}
.grow + .grow::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
button.grow:hover{background:var(--fill)}
.grow .txt{flex:1;min-width:0}
.grow .txt b{display:block;font-weight:600;overflow-wrap:anywhere}
.grow .txt small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.grow.accent{color:var(--accent);font-weight:500}
.grow .chev{color:var(--muted);opacity:.6}
.grow input[type=date]{width:auto;flex:none}
.grow .bar{width:5px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.grow.free{color:var(--muted);font-size:15px}
.grow.is-done .txt b{text-decoration:line-through;color:var(--muted)}
.dot{width:20px;height:20px;border-radius:6px;background:var(--c);flex:none}

/* ---------- Deadline rows ---------- */
ul.items{list-style:none;margin:0;padding:0;background:var(--cardbg);border-radius:22px;overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:11px 14px 11px 28px;position:relative}
.item + .item{box-shadow:inset 0 1px 0 var(--line)}
.item::before{content:"";width:5px;border-radius:3px;background:var(--c);position:absolute;left:13px;top:10px;bottom:10px}
.item-main{border:0;background:none;text-align:left;padding:0;min-width:0}
.item-title{display:flex;align-items:center;gap:6px;font-weight:600;font-size:17px;overflow-wrap:anywhere}
.item-title .k{color:var(--c);font-size:14px}
.item-meta{display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--muted);font-size:13px;margin-top:2px}
.item.done .item-title{text-decoration:line-through;color:var(--muted)}
.item.selected{background:var(--tint)}
.flag{color:var(--danger);font-weight:800}
.when{font-weight:700;font-size:12px;white-space:nowrap;padding:4px 9px;border-radius:999px;background:var(--fill)}
.when.urgent{background:var(--danger);color:#fff}
.when.soon{background:color-mix(in srgb,var(--c) 24%,transparent)}
details.done-group{margin-top:22px;background:var(--cardbg);border-radius:22px;overflow:hidden}
details.done-group summary{cursor:pointer;padding:13px 16px;color:var(--muted);font-weight:500;list-style:none;display:flex;justify-content:space-between}
details.done-group summary::-webkit-details-marker{display:none}
details.done-group summary::after{content:"›";transform:rotate(90deg);font-size:20px;line-height:1}
details.done-group[open] summary::after{transform:rotate(-90deg)}
details.done-group ul.items{border-radius:0;box-shadow:inset 0 1px 0 var(--line)}

/* ---------- Due page ---------- */
.hero{padding:0 0 4px}
.hero h1{font-weight:700;font-size:22px;line-height:1.25;margin:0;max-width:30ch}
.hero p{margin:6px 0 0;color:var(--muted);font-size:15px}
.hero .swatch{display:inline-block;width:.6em;height:.6em;border-radius:3px;background:var(--c);margin-right:.35em;vertical-align:.05em}
.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 2px;scrollbar-width:none;margin:0 -2px}
.filters::-webkit-scrollbar{display:none}
.filters .spacer{flex:1 0 8px}
.chip{flex:none;border:0;background:var(--cardbg);padding:8px 14px;border-radius:999px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-fill);color:#fff}
.chip .k{color:var(--c)}
.chip[aria-pressed="true"] .k{color:#fff}
.group{margin-top:4px}
.group h2{display:flex;gap:8px;margin:22px 16px 7px;color:var(--muted);font-size:13px;font-weight:600}
.group h2 .count{font-weight:400}
.group.overdue h2{color:var(--danger)}
.empty{padding:30px 4px;max-width:520px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:22px;margin:0 0 6px}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:16;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 18px;border-radius:999px;width:min(520px,calc(100vw - 24px));
  background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.selbar .count{flex:1;font-weight:600}
@media (min-width:900px){ .selbar{bottom:24px} }

/* ---------- Day page ---------- */
.day-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:4px 0 16px}
.day-title{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.01em;line-height:1.05;margin:0}
.day-sub{margin:4px 0 0;color:var(--muted);font-size:17px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 12px}
.tile{background:var(--cardbg);border:0;border-radius:20px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;color:inherit;font:inherit}
button.tile:hover{background:color-mix(in srgb,var(--cardbg) 85%,var(--accent))}
.tile .l{font-size:12px;color:var(--muted);font-weight:600}
.tile .n{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1}
.tile small{font-size:11px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.tile .bar,.loading .bar{display:block;height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin-top:6px}
.tile .bar i{display:block;height:100%;background:var(--accent-fill);border-radius:2px}
.quick{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qbtn{flex:none;border:0;background:var(--cardbg);border-radius:999px;padding:9px 14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:7px}
.qbtn svg{color:var(--accent)}
.qbtn:hover{background:var(--fill2)}
.coach{background:var(--cardbg);border-radius:20px;padding:16px;margin:0 0 10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.coach p{margin:0}
.coach-label{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--accent)}
.special-banner{background:var(--cardbg);border-radius:20px;padding:12px 16px;margin-bottom:10px;font-size:15px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--cardbg);border-radius:20px;padding:14px 16px;margin:0 0 16px}
.banner p{margin:0;flex:1 1 260px;font-size:15px}
ul.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tl{display:grid;grid-template-columns:70px 1fr;gap:12px}
.tl-time{text-align:right;padding-top:11px;font-size:15px;line-height:1.25}
.tl-time b{white-space:nowrap;font-weight:600}
.tl-time small{display:block;color:var(--muted);font-size:12px}
.tl-body{border-radius:14px;padding:12px 12px 12px 17px;background:color-mix(in srgb,var(--c) 18%,var(--page));border:0;box-shadow:inset 5px 0 0 var(--c);display:flex;gap:10px;align-items:center;min-width:0;width:100%;text-align:left;color:inherit}
.tl-body .txt{flex:1;min-width:0}
.tl-body b{display:flex;align-items:center;gap:6px;font-weight:600;overflow-wrap:anywhere}
.tl-body b .k{color:var(--c)}
.tl-body small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.tl.study .tl-body,.tl.due .tl-body{background:var(--cardbg);outline:1px dashed color-mix(in srgb,var(--c) 70%,transparent);outline-offset:-1px}
.tl.past{opacity:.5}
.tl.now .tl-body{outline:2px solid var(--accent);outline-offset:-2px}
.tl.now .tl-time b{color:var(--accent)}
.tl.done .txt b{text-decoration:line-through;color:var(--muted)}
/* Welcome */
.welcome{padding:10px 0;max-width:560px}
.welcome .logo-lg{width:68px;height:68px;display:block;margin:6px 0 16px;filter:drop-shadow(0 10px 22px rgba(233,64,122,.35))}
.welcome h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;margin:0 0 4px}
.welcome > p{color:var(--muted);margin:0 0 22px}
.welcome-steps{list-style:none;counter-reset:w;padding:0;margin:0 0 22px;display:flex;flex-direction:column;gap:20px}
.welcome-steps li{counter-increment:w;display:grid;grid-template-columns:30px 1fr;gap:14px}
.welcome-steps li::before{content:counter(w);width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
.welcome-steps b{font-weight:600}
.welcome-steps p{margin:3px 0 10px;color:var(--muted);font-size:15px}

/* ---------- Week ---------- */
.wslot{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;border:0;background:none;text-align:left;color:inherit;position:relative}
.wslot + .wslot::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.wslot .bar{width:5px;align-self:stretch;min-height:34px;border-radius:3px;background:var(--c);flex:none}
.wslot.dashed .bar{background:repeating-linear-gradient(var(--c) 0 6px,transparent 6px 10px)}
.wslot .txt{flex:1;min-width:0}
.wslot b{display:flex;gap:6px;align-items:center;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.wslot b .k{color:var(--c)}
.wslot small{display:block;color:var(--muted);font-size:13px}
.wslot.is-done b{text-decoration:line-through;color:var(--muted)}
button.wslot:hover{background:var(--fill)}

/* ---------- Month ---------- */
.mcard{background:var(--cardbg);border-radius:22px;padding:12px 10px 10px}
.mhead,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mhead{margin-bottom:4px}
.mhead span{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.mcell{min-height:58px;border:0;background:none;border-radius:14px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;color:inherit;cursor:pointer}
.mcell:hover{background:var(--fill)}
.mcell.out .mnum{color:var(--muted);opacity:.6}
.mcell.off{background:color-mix(in srgb,var(--orange) 10%,transparent)}
.mnum{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:500}
.mcell.today .mnum{background:var(--accent-fill);color:#fff;font-weight:700}
.mitems{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:8px;max-width:100%}
.mchip{width:6px;height:6px;border-radius:50%;background:var(--c);font-size:0;overflow:hidden}
.mchip.exam{width:8px;height:8px}
.mchip.done{opacity:.35}
.mstudy{color:var(--accent);display:inline-flex}
.mstudy svg{width:9px;height:9px;stroke-width:2.6}
.mmore,.moff{font-size:9px;color:var(--muted);font-weight:700;line-height:8px}
@media (min-width:700px){ .mcell{min-height:72px} }

/* ---------- AI ---------- */
.ai-hero{background:var(--brand);color:#fff;border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 34px rgba(233,64,122,.25);margin-bottom:6px}
.ai-hero p{margin:0;color:rgba(255,255,255,.92)}
.ai-hero .coach-label{color:rgba(255,255,255,.9)}
.ai-title{font-family:var(--display);font-weight:800;font-size:24px;margin:0;color:#fff}
.ai-summary{font-size:20px;font-weight:600;line-height:1.3;color:#fff!important}
.ai-stats{display:flex;gap:22px;flex-wrap:wrap}
.ai-stats span{display:flex;flex-direction:column;font-size:12px;color:rgba(255,255,255,.85)}
.ai-stats b{font-family:var(--display);font-size:22px;color:#fff;order:-1}
.ai-hero .btn,.ai-hero .btn.primary{background:#fff;color:var(--violet);padding:11px 18px;font-size:17px}
.sess-day{margin-bottom:12px}
.sess-date{border:0;background:none;padding:4px 0 6px;font-weight:600;color:var(--muted);font-size:15px;cursor:pointer}
.sess{display:flex;align-items:center;gap:12px;padding:11px 12px 11px 17px;background:var(--cardbg);border-radius:14px;box-shadow:inset 5px 0 0 var(--c);margin-bottom:6px}
.sess .txt{flex:1;min-width:0}
.sess b{display:block;font-weight:600;overflow-wrap:anywhere}
.sess small{display:block;color:var(--muted);font-size:13px}
.sess.done b{text-decoration:line-through;color:var(--muted)}
.tool{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--cardbg);border:0;border-radius:20px;padding:16px;color:inherit;font:inherit;cursor:pointer}
.tool:hover{background:var(--fill2)}
.tool-ic{width:34px;height:34px;flex:none;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center}
.tool-ic svg{width:20px;height:20px}
.tool b{display:block;font-weight:600}
.tool small{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.card{background:var(--cardbg);border-radius:22px;padding:18px}
.card.flow{display:flex;flex-direction:column;gap:14px}
.plan-row{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.plan-row small{display:block;color:var(--muted);font-size:13px}
.pdot{width:12px;height:12px;border-radius:4px;margin-top:5px;background:var(--c)}
.loading{padding:26px 0;text-align:center}
.loading .bar{max-width:240px;margin:18px auto 0;height:6px}
.loading .bar i{display:block;height:100%;width:40%;background:var(--accent-fill);border-radius:3px;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.ai-note{background:var(--fill);border-radius:12px;padding:10px 12px;font-size:15px}

/* ---------- Settings ---------- */
.panel{padding:0}
.panel > h2{margin:24px 16px 7px;color:var(--muted);font-size:13px;font-weight:600}
.panel > p{color:var(--muted);margin:0 16px 12px;font-size:15px}
.box{background:var(--cardbg);border-radius:22px;padding:16px;margin-bottom:14px}
.box h3{margin:0 0 6px;font-size:17px;font-weight:600}
.box p{margin:0 0 12px;color:var(--muted);font-size:15px}
.box p:last-child{margin-bottom:0}
.box a{color:var(--accent);text-decoration:none;font-weight:500}
.box .opt + .opt{border-top:1px solid var(--line)}
.remind{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;margin:10px 0 14px;font-size:15px}
.remind select{width:auto}
.seg{display:inline-flex;gap:2px;background:var(--fill);padding:2px;border-radius:10px;flex-wrap:wrap}
.seg-btn{border:0;background:transparent;padding:7px 16px;border-radius:8px;font-weight:500;font-size:15px}
.seg-btn[aria-checked="true"]{background:var(--sheetcell);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.12)}
ol.order{list-style:none;margin:6px 0 10px;padding:0;border-radius:14px;overflow:hidden;background:var(--fill)}
ol.order li{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px}
ol.order li + li{box-shadow:inset 0 1px 0 var(--line)}
ol.order li span:not(.tag){flex:1;font-weight:500}
ol.order svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--accent)}
.obtn{border:0;background:var(--cardbg);width:36px;height:36px;border-radius:50%;font-size:16px;font-weight:700;color:var(--accent)}
.obtn:disabled{opacity:.3;cursor:default}
.key-row{display:flex;gap:10px;margin:12px 0 8px;flex-wrap:wrap}
.key-row input{flex:1 1 220px}
.social{display:grid;gap:10px;max-width:380px;margin:14px 0 4px}
.social-btn{width:100%;font-size:17px;padding:13px 18px;background:var(--sheetcell);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.social-btn.apple{background:#000;color:#fff;box-shadow:none}
:root[data-theme="dark"] .social-btn.apple{background:#fff;color:#000}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .social-btn.apple{background:#fff;color:#000}}
.social .or{text-align:center;margin:4px 0 0}

/* ---------- Sheets (dialogs) ---------- */
dialog{border:0;padding:0;background:var(--sheet);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 48px);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:auto;overscroll-behavior:contain}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog[open]{animation:sheetIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
@media (max-width:640px){
  dialog{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:22px 22px 0 0;max-height:94dvh;padding-bottom:env(safe-area-inset-bottom,0px)}
  dialog[open]{animation:sheetUp .32s cubic-bezier(.2,.8,.2,1)}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
  .sheet-head::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--fill2)}
}
dialog:focus,dialog:focus-visible{outline:none}
.sheet-head{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:16px 16px 12px;background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px)}
.sheet-head h2{margin:0;font-size:17px;font-weight:600;text-align:center;font-family:var(--body)}
.sheet-head .l{justify-self:start}
.sheet-head .r{justify-self:end}
.tbtn{border:0;background:none;color:var(--accent);font-size:17px;padding:6px 2px}
.tbtn.strong{font-weight:600}
.sheet-body{padding:6px 16px 22px;display:flex;flex-direction:column;gap:18px}
dialog .dlg p{margin:0}
.fgroup{background:var(--sheetcell);border-radius:14px;overflow:hidden}
.fgroup > *{padding:10px 16px}
.fgroup > * + *{box-shadow:inset 0 1px 0 var(--line)}
.fgroup > .opt{padding:8px 16px}
.field{display:flex;flex-direction:column;gap:3px}
.field > span{font-size:13px;color:var(--muted);font-weight:500}
.field .hint{font-weight:400}
.fgroup input[type=text],.fgroup input[type=date],.fgroup input[type=time],.fgroup input[type=number],.fgroup select,.fgroup textarea{background:transparent;padding:4px 0;border-radius:0}
.fgroup textarea{min-height:70px}
.fgroup input:focus,.fgroup select:focus,.fgroup textarea:focus{outline:none}
.fgroup:focus-within{box-shadow:0 0 0 2px var(--tint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kinds{display:flex;gap:6px;flex-wrap:wrap}
.kinds label{position:relative}
.kinds input{position:absolute;opacity:0;inset:0}
.kinds span{display:inline-flex;align-items:center;gap:6px;background:var(--sheetcell);padding:8px 13px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer}
.kinds span svg{color:var(--accent)}
.kinds input:checked + span{background:var(--accent-fill);color:#fff}
.kinds input:checked + span svg{color:#fff}
.kinds input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.colors{display:flex;gap:10px;flex-wrap:wrap;padding-top:4px}
.colors label{position:relative}
.colors input{position:absolute;opacity:0;inset:0}
.colors span{display:block;width:32px;height:32px;border-radius:50%;background:var(--c);cursor:pointer}
.colors input:checked + span{box-shadow:0 0 0 3px var(--sheetcell),0 0 0 5px var(--c)}
.colors input:focus-visible + span{outline:3px solid var(--accent);outline-offset:4px}
.session{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr auto;gap:8px;align-items:center}
.session select,.session input{background:var(--fill)!important;padding:8px 10px!important;border-radius:10px!important}
.session button{border:0;background:none;color:var(--danger);font-size:22px;padding:2px 8px}
.del-row{width:100%;border:0;background:var(--sheetcell);color:var(--danger);font-size:17px;padding:13px;border-radius:14px}
.drop{display:block;position:relative;border:2px dashed var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;background:var(--sheetcell)}
.drop:hover,.drop:focus-within{border-color:var(--accent)}
.drop b{display:block;font-weight:600}
.drop > span{display:block;color:var(--muted);font-size:15px}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs:empty{display:none}
.thumb{position:relative;width:68px;height:68px;border-radius:12px;overflow:hidden;background:var(--sheetcell);display:grid;place-items:center;font-size:12px;text-align:center;padding:4px;overflow-wrap:anywhere}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:1;padding:0;z-index:1}
.review h3{font-size:17px;font-weight:600;margin:8px 0 0}
.pick{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pick input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;border:2px solid color-mix(in srgb,var(--muted) 70%,transparent);margin-top:1px;display:grid;place-content:center}
.pick input:checked{background:var(--accent-fill);border-color:var(--accent-fill)}
.pick input:checked::after{content:"";width:9px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.pick small{display:block;color:var(--muted);font-size:13px}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}
.foot .right{display:flex;gap:10px;margin-left:auto}
@media (max-width:520px){
  .two{grid-template-columns:1fr}
  .session{grid-template-columns:1fr 1fr}
  .tiles{gap:8px}
  .tile{padding:10px}
  .tile .n{font-size:24px}
  .day-title{font-size:36px}
  .tl{grid-template-columns:58px 1fr;gap:10px}
}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);padding:12px 20px;border-radius:24px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;width:max-content;max-width:min(90vw,520px);text-align:center;z-index:40;
  background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){ .toast{bottom:28px} }
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="bmg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6A4DFF"/><stop offset=".55" stop-color="#E9407A"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient>
  <linearGradient id="bmi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6A4DFF"/><stop offset="1" stop-color="#F0437A"/></linearGradient>
  <symbol id="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="url(#bmg)"/><rect x="15" y="17.5" width="34" height="31" rx="7.5" fill="#fff"/><rect x="21.5" y="13" width="4.5" height="9" rx="2.25" fill="#fff"/><rect x="38" y="13" width="4.5" height="9" rx="2.25" fill="#fff"/><path d="M24.5 34.5l5 5 10.5-11" fill="none" stroke="url(#bmi)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M51 6c.7 3.6 2 4.9 5.6 5.6C53 12.3 51.7 13.6 51 17.2c-.7-3.6-2-4.9-5.6-5.6C49 10.9 50.3 9.6 51 6z" fill="#fff"/></symbol>
</defs></svg>
<div class="glow" aria-hidden="true"></div>
<header class="top">
  <div class="top-left"><div class="brand"><svg class="brand-mark" aria-hidden="true"><use href="#logo"/></svg><span>Calendar Planner</span></div><button type="button" class="sync-chip" id="syncChip" hidden>Synced</button></div>
  <button class="glassbtn" id="fab" type="button" aria-label="Add" aria-haspopup="menu" aria-expanded="false"><span class="plus"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></button>
</header>
<div class="wrap">
  <main id="view"></main>
</div>
<nav class="tabbar" role="tablist" aria-label="Sections"></nav>
<div class="menu" id="addMenu" role="menu" aria-label="Add" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="restoreInput" accept=".json,application/json" class="sr" tabindex="-1">

<!-- Item dialog -->
<dialog id="itemDlg" aria-labelledby="itemDlgTitle">
  <form id="itemForm" method="dialog" novalidate>
    <div class="sheet-head"><button type="button" class="tbtn l" data-close>Cancel</button><h2 id="itemDlgTitle">Add homework</h2><button type="submit" class="tbtn strong r" id="itemSave">Save</button></div>
    <div class="sheet-body">
      <div class="kinds" role="radiogroup" aria-label="Type" id="kindPick"></div>
      <div class="fgroup">
        <label class="field"><span>Title</span><input type="text" name="title" placeholder="e.g. Problem set 4" autocomplete="off"></label>
        <label class="field"><span>Class</span><select name="classId" id="classSelect"></select></label>
      </div>
      <div class="fgroup">
        <div class="two">
          <label class="field"><span id="dateLabel">Due date</span><input type="date" name="due"></label>
          <label class="field"><span>Time <span class="hint">(optional)</span></span><input type="time" name="time"></label>
        </div>
        <div class="two exam-only">
          <label class="field"><span>Length (minutes)</span><input type="number" name="duration" min="15" step="15" value="120"></label>
          <label class="field"><span>Room or place</span><input type="text" name="room" autocomplete="off"></label>
        </div>
      </div>
      <div class="fgroup">
        <label class="opt"><input type="checkbox" name="high"> Important</label>
        <label class="field"><span>Notes</span><textarea name="notes" placeholder="Pages, instructions, links…"></textarea></label>
      </div>
      <p class="error" id="itemError" hidden></p>
      <button type="button" class="del-row" id="itemDelete" hidden>Delete</button>
    </div>
  </form>
</dialog>

<!-- Import dialog -->
<dialog id="importDlg" aria-labelledby="importTitle">
  <div class="dlg">
    <div class="sheet-head"><span></span><h2 id="importTitle">Import from a photo</h2><button type="button" class="tbtn strong r" data-close>Close</button></div>
    <div id="importBody" class="sheet-body"></div>
  </div>
</dialog>

<!-- From a friend dialog -->
<dialog id="sharedDlg" aria-labelledby="sharedTitle">
  <div class="dlg">
    <div class="sheet-head"><span></span><h2 id="sharedTitle">From a friend</h2><button type="button" class="tbtn strong r" data-close>Close</button></div>
    <div id="sharedBody" class="sheet-body"></div>
  </div>
</dialog>

<!-- Day off dialog -->
<dialog id="specialDlg" aria-labelledby="specialDlgTitle">
  <form id="specialForm" method="dialog" novalidate>
    <div class="sheet-head"><button type="button" class="tbtn l" data-close>Cancel</button><h2 id="specialDlgTitle">Add a day off</h2><button type="submit" class="tbtn strong r">Save</button></div>
    <div class="sheet-body">
      <div class="fgroup">
        <label class="field"><span>Name</span><input type="text" name="label" placeholder="e.g. Thanksgiving, study week" autocomplete="off"></label>
        <label class="field"><span>What happens that day</span>
          <select name="follows">
            <option value="0">No classes</option>
            <option value="1">Follows Monday's schedule</option>
            <option value="2">Follows Tuesday's schedule</option>
            <option value="3">Follows Wednesday's schedule</option>
            <option value="4">Follows Thursday's schedule</option>
            <option value="5">Follows Friday's schedule</option>
          </select></label>
      </div>
      <div class="fgroup">
        <div class="two">
          <label class="field"><span id="specialStartLabel">From</span><input type="date" name="start"></label>
          <label class="field" id="specialEndWrap"><span>To <span class="hint">(optional)</span></span><input type="date" name="end"></label>
        </div>
      </div>
      <p class="error" id="specialError" hidden></p>
      <button type="button" class="del-row" id="specialDelete" hidden>Delete</button>
    </div>
  </form>
</dialog>

<!-- Class dialog -->
<dialog id="classDlg" aria-labelledby="classDlgTitle">
  <form id="classForm" method="dialog" novalidate>
    <div class="sheet-head"><button type="button" class="tbtn l" data-close>Cancel</button><h2 id="classDlgTitle">Add a class</h2><button type="submit" class="tbtn strong r">Save</button></div>
    <div class="sheet-body">
      <div class="fgroup">
        <label class="field"><span>Class name</span><input type="text" name="name" placeholder="e.g. Calculus I" autocomplete="off"></label>
        <label class="field"><span>Teacher <span class="hint">(optional)</span></span><input type="text" name="teacher" autocomplete="off"></label>
        <div class="field"><span>Color</span><div class="colors" id="colorPick"></div></div>
      </div>
      <div class="fgroup">
        <div class="field">
          <span>When it meets</span>

/* ---------- local storage ---------- */
function blank(){
  return {classes:[],items:[],specialDays:[],plan:{createdAt:0,summary:"",blocks:[]},meta:{updatedAt:0},
    settings:{termStart:"",termEnd:"",termRev:0,remindTask:1440,remindExam:1440,remindClass:0,remindStudy:15,incTasks:true,incExams:true,incClasses:true,incStudy:true,
      tabOrder:["day","agenda","week","month","ai","classes","sync"],

}
const TAB_KEYS = ["day","agenda","week","month","ai","classes","sync"];
function cleanOrder(o){
  const seen = new Set(), out = [];
  (Array.isArray(o)?o:[]).forEach(k=>{ if(TAB_KEYS.includes(k) && !seen.has(k)){ seen.add(k); out.push(k); } });
  TAB_KEYS.forEach(k=>{ if(!seen.has(k)) out.push(k); });
  return out;
}
function normalize(d){
  const b = blank();
  return {
    classes: Array.isArray(d.classes) ? d.classes : [],
    items: Array.isArray(d.items) ? d.items : [],
    specialDays: Array.isArray(d.specialDays) ? d.specialDays : [],
    plan: Object.assign(b.plan, d.plan || {}),
    meta: Object.assign(b.meta, d.meta || {}),
    settings: Object.assign(b.settings, d.settings || {}, {planner: Object.assign(b.settings.planner, (d.settings||{}).planner || {}),
      tabOrder: cleanOrder((d.settings||{}).tabOrder)})

}
function load(){
  try{ const s = localStorage.getItem(KEY); if(s) return normalize(JSON.parse(s)); }catch(e){}

}
let storageWarned = false;
function saveLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }

}
/** Every user change goes through here: save, then sync. */
function commit(){
  state.meta.updatedAt = Date.now();
  saveLocal();
  schedulePush();
}
let state = load();

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const uid = ()=>(window.crypto && crypto.randomUUID) ? crypto.randomUUID().toUpperCase() : (Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const esc = s=>String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n=>String(n).padStart(2,"0");
const ymd = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s=>{ const [y,m,d]=String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); };
const today = ()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const dayDiff = (a,b)=>Math.round((Date.UTC(a.getFullYear(),a.getMonth(),a.getDate())-Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()))/864e5);
const isoDay = d=>(d.getDay()+6)%7+1; // Mon=1..Sun=7
const mondayOf = d=>addDays(d,1-isoDay(d));
const withTime = (d,t)=>{ const [h,m]=String(t||"23:59").split(":").map(Number); const x=new Date(d); x.setHours(h||0,m||0,0,0); return x; };
const dueAt = it=>withTime(parseYmd(it.due), it.time || "23:59");
const fmtDate = d=>d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const fmtTime = t=>{ if(!t) return ""; return withTime(new Date(),t).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); };
const classById = id=>state.classes.find(c=>c.id===id);
const colorOf = it=>{ const c=classById(it.classId); return c ? c.color : NOCLASS; };
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const isStandalone = navigator.standalone===true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);

function relWhen(it){
  const diff = dayDiff(parseYmd(it.due), today());
  if(diff < 0) return {text: diff===-1 ? "1 day late" : `${-diff} days late`, cls:"urgent"};
  if(diff === 0) return {text: it.time ? `Today ${fmtTime(it.time)}` : "Today", cls:"urgent"};
  if(diff === 1) return {text:"Tomorrow", cls:"soon"};
  return {text:`in ${diff} days`, cls: diff<=3 ? "soon" : ""};
}

let toastTimer;

/* =========================================================
   ACCOUNT SYNC
   One Calendar Planner account keeps the Windows app, the iPhone app
   and any browser in step. Each class, deadline, day off, study session
   and the semester settings is saved as its own record, so two devices
   editing different things never overwrite each other. If both edit the
   same thing, the newest edit wins. Deleted things leave a small marker
   so the deletion reaches the other devices too.
   ========================================================= */
// Your settings live in config.js (next to this file), so updating the app never erases them.
const ACCOUNT = Object.assign({
  url: "",           // your Supabase Project URL, e.g. "https://abcdefghijklm.supabase.co"
  key: "",           // the publishable key (sb_publishable_...)
  reviewEmail: "",   // the store-review test account, if any
  google: false,     // Sign in with Google
  apple: false       // Sign in with Apple (needs a secret renewed every 6 months)
}, window.CALENDAR_PLANNER_CONFIG || {});
const LINKS = {privacy: "privacy.html", support: "support.html"};
const isReviewEmail = e=>!!ACCOUNT.reviewEmail && String(e||"").trim().toLowerCase() === ACCOUNT.reviewEmail.trim().toLowerCase();
const ACC_KEY = "calendarplanner:account";
const PREFS_ID = "prefs";
function loadAcc(){ try{ return JSON.parse(localStorage.getItem(ACC_KEY)) || {}; }catch(e){ return {}; } }
function saveAcc(){ try{ localStorage.setItem(ACC_KEY, JSON.stringify(acc)); }catch(e){} }
let acc = loadAcc();   // {email, userId, access, refresh, expiresAt, cursor, cache, lastSync, pendingEmail}
let syncUi = {s:"ok", msg:""};
const accountReady = ()=>!!(ACCOUNT.url && ACCOUNT.key);
function connected(){ return !!(accountReady() && acc.userId && acc.refresh); }
const accErr = (msg, code)=>{ const e = new Error(msg); e.userMsg = msg; e.code = code; return e; };

async function sbFetch(path, opts={}, retry=true){
  const {method="GET", body, auth=true, prefer} = opts;
  if(!accountReady()) throw accErr("Accounts aren't set up in this copy of the app yet.", "config");
  const headers = {"apikey": ACCOUNT.key, "Content-Type":"application/json"};
  if(auth){
    if(!acc.access || (acc.expiresAt||0) < Date.now() + 60000) await refreshSession();
    headers.Authorization = "Bearer " + acc.access;
  }
  if(prefer) headers.Prefer = prefer;
  let res;
  try{
    res = await fetch(ACCOUNT.url.replace(/\/+$/,"") + path, {method, headers, cache:"no-store",
      body: body===undefined ? undefined : JSON.stringify(body)});
  }catch(e){ throw accErr("You're offline.", "offline"); }
  const text = await res.text();
  let data = null; try{ data = text ? JSON.parse(text) : null; }catch(e){}
  if(res.status===401 && auth && retry){ acc.expiresAt = 0; return sbFetch(path, opts, false); }
  if(!res.ok){
    const detail = String((data && (data.msg || data.message || data.error_description || data.error)) || "");
    const e = accErr(detail, res.status===401||res.status===403 ? "auth" : res.status===429 ? "rate" : "http");
    e.status = res.status; throw e;
  }
  return data;
}
let refreshing = null;
function refreshSession(){
  if(!refreshing){
    refreshing = (async ()=>{
      if(!acc.refresh) throw accErr("Signed out.", "auth");
      try{
        setSession(await sbFetch("/auth/v1/token?grant_type=refresh_token", {method:"POST", auth:false, body:{refresh_token:acc.refresh}}));
      }catch(e){
        if(e.status===400 || e.status===401 || e.status===403) throw accErr("Signed out.", "auth");
        throw e;
      }
    })().finally(()=>{ refreshing = null; });
  }
  return refreshing;
}
function setSession(d){
  acc.access = d.access_token; acc.refresh = d.refresh_token;
  acc.expiresAt = Date.now() + (+d.expires_in || 3600)*1000;
  if(d.user){ acc.userId = d.user.id; acc.email = d.user.email || acc.email; }
  saveAcc();
}
async function sendCode(email){
  email = String(email||"").trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw accErr("Type a valid email address.", "input");
  if(!isReviewEmail(email)) await sbFetch("/auth/v1/otp", {method:"POST", auth:false, body:{email, create_user:true}});
  acc.pendingEmail = email; saveAcc();
}
async function verifyCode(code){
  code = String(code||"").replace(/\s/g,"");
  if(!/^\d{6,10}$/.test(code)) throw accErr("Type the code from the email.", "input");
  const d = isReviewEmail(acc.pendingEmail)
    ? await sbFetch("/auth/v1/token?grant_type=password", {method:"POST", auth:false, body:{email:acc.pendingEmail, password:code}})
    : await sbFetch("/auth/v1/verify", {method:"POST", auth:false, body:{type:"email", email:acc.pendingEmail, token:code}});
  adoptSession(d, acc.pendingEmail);
}
/** A new sign-in: keep this device's sync record only if it's the same account as last time. */
function adoptSession(d, email){
  const sameUser = d.user && d.user.id === acc.lastUserId;
  const keep = sameUser ? {cursor:acc.cursor, cache:acc.cache} : {};
  acc = Object.assign({email: email || (d.user && d.user.email) || ""}, keep);
  setSession(d);
  acc.lastUserId = acc.userId; saveAcc();
}

/* ----- Sign in with Google or Apple (OAuth with PKCE, through Supabase) ----- */
const PKCE_KEY = "calendarplanner:pkce";
const b64url = buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function startOAuth(provider){
  if(!accountReady()) throw accErr("Accounts aren't set up in this copy of the app yet.", "config");
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  try{ localStorage.setItem(PKCE_KEY, JSON.stringify({verifier, provider, t:Date.now()})); }catch(e){}
  const back = appAddress();
  location.href = ACCOUNT.url.replace(/\/+$/,"") + "/auth/v1/authorize?provider=" + encodeURIComponent(provider)
    + "&redirect_to=" + encodeURIComponent(back)
    + "&code_challenge=" + encodeURIComponent(challenge) + "&code_challenge_method=s256";
}
/** Back from Google or Apple: trade the one-time code for a session. */
async function finishOAuth(){
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), err = q.get("error_description") || q.get("error");
  if(!code && !err) return;
  history.replaceState(null, "", location.pathname + location.hash);
  ui.tab = "sync";
  let saved = null; try{ saved = JSON.parse(localStorage.getItem(PKCE_KEY)); localStorage.removeItem(PKCE_KEY); }catch(e){}
  if(err || !saved || !saved.verifier){
    ui.accError = err ? "Sign-in was cancelled or didn't work. Try again." : "Sign-in took too long. Try again.";
    render(); return;
  }
  ui.accBusy = true; render();
  try{
    const d = await sbFetch("/auth/v1/token?grant_type=pkce", {method:"POST", auth:false, body:{auth_code:code, code_verifier:saved.verifier}});
    adoptSession(d);
    ui.accBusy = false; render();
    await runSync(); toast("Signed in. Your planner is synced.");
  }catch(e){
    ui.accError = e.code==="offline" ? "You're offline. Try again once you're connected." : "Sign-in didn't work. Try again.";
  }
  ui.accBusy = false; render();
}
function wipeDevice(){
  state = blank(); saveLocal();
  const last = acc.userId || acc.lastUserId, email = acc.email;
  acc = {email, lastUserId:last}; saveAcc();
  ui.tab = state.settings.tabOrder[0]; ui.day = today();
}
async function signOut(){
  try{ if(acc.access) await sbFetch("/auth/v1/logout", {method:"POST"}, false); }catch(e){}
  wipeDevice(); acc.lastUserId = null; acc.cache = null; acc.cursor = null; saveAcc();
  setStatus("ok"); render();
}

/* ----- records: the format shared with the iPhone app ----- */
const KIND_LIST = ["homework","assignment","project","reading","exam","event"];
const S = (x,n)=>String(x ?? "").slice(0,n);
const HM = x=>/^\d{2}:\d{2}$/.test(String(x||"")) ? String(x) : "";
const YMD = x=>/^\d{4}-\d{2}-\d{2}$/.test(String(x||"")) ? String(x) : "";
const INT = (x,lo,hi,def)=>{ const n = parseInt(x,10); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : def; };
/** The cleaned-up form of a record. Both apps produce exactly this, so equal data compares equal. */
function canon(type, d){
  d = d && typeof d==="object" ? d : {};
  if(type==="course") return {name:S(d.name,80), teacher:S(d.teacher,80),
    color: /^#[0-9A-Fa-f]{6}$/.test(String(d.color||"")) ? String(d.color).toUpperCase() : COLORS[0],
    sessions:(Array.isArray(d.sessions)?d.sessions:[]).slice(0,40).map(x=>({id:S(x&&x.id,60), day:INT(x&&x.day,1,7,1), start:HM(x&&x.start), end:HM(x&&x.end), room:S(x&&x.room,40)}))
      .filter(x=>x.start && x.end)
      .sort((p,q)=>(p.day-q.day) || (p.start<q.start?-1:p.start>q.start?1:0) || (p.id<q.id?-1:p.id>q.id?1:0))};
  if(type==="item"){
    const kind = KIND_LIST.includes(d.kind) ? d.kind : "homework", blk = isBlockKind(kind);
    return {kind, title:S(d.title,200), course:S(d.course,60), date:YMD(d.date), time:HM(d.time),
      duration: blk ? INT(d.duration,15,1440,120) : 0, location: blk ? S(d.location,80) : "",
      notes:S(d.notes,2000), important:!!d.important, done:!!d.done};
  }
  if(type==="special") return {label:S(d.label,80), start:YMD(d.start), end:YMD(d.end)||YMD(d.start), follows:INT(d.follows,0,7,0)};
  if(type==="block") return {item:S(d.item,60), title:S(d.title,200), date:YMD(d.date), start:HM(d.start), end:HM(d.end), focus:S(d.focus,120), done:!!d.done};
  if(type==="prefs") return {termStart:YMD(d.termStart), termEnd:YMD(d.termEnd), planSummary:S(d.planSummary,800),
    wdFrom:HM(d.wdFrom)||"16:00", wdTo:HM(d.wdTo)||"22:00", weFrom:HM(d.weFrom)||"10:00", weTo:HM(d.weTo)||"18:00",
    maxMin:INT(d.maxMin,15,720,180), session:INT(d.session,15,240,45), horizon:INT(d.horizon,1,30,7), notes:S(d.notes,600)};
  return null;
}
function validRecord(type, d){
  if(!d) return false;
  if(type==="item") return !!(d.date && d.title);
  if(type==="special") return !!d.start;
  if(type==="block") return !!(d.date && d.start && d.end);
  if(type==="course") return !!d.name;
  return true;
}
function localRecords(){
  const out = {};
  const put = (id, type, obj, raw)=>{
    if(!id) return;
    const data = canon(type, raw);
    out[id] = {type, data, h:JSON.stringify(data), u:+obj.updatedAt||0, obj};
  };
  state.classes.forEach(c=>put(c.id, "course", c, {name:c.name, teacher:c.teacher, color:c.color, sessions:c.sessions}));
  state.items.forEach(i=>put(i.id, "item", i, {kind:i.kind, title:i.title, course:i.classId, date:i.due, time:i.time,
    duration:i.duration, location:i.room, notes:i.notes, important:i.priority==="high", done:i.done}));
  state.specialDays.forEach(x=>put(x.id, "special", x, x));
  state.plan.blocks.forEach(b=>put(b.id, "block", b, {item:b.itemId, title:b.title, date:b.date, start:b.start, end:b.end, focus:b.focus, done:b.done}));
  const st = state.settings;
  put(PREFS_ID, "prefs", st, Object.assign({termStart:st.termStart, termEnd:st.termEnd, planSummary:state.plan.summary}, st.planner));
  return out;
}
function applyRemote(id, type, d, u){
  const upsert = (list, obj)=>{ const i = list.findIndex(x=>x.id===id); if(i>=0) list[i] = obj; else list.push(obj); return i>=0 ? list[i] : obj; };
  if(type==="course"){
    const old = state.classes.find(c=>c.id===id);
    upsert(state.classes, {id, name:d.name, teacher:d.teacher, color:d.color, updatedAt:u, rev:((old&&old.rev)||0)+1,
      sessions:d.sessions.map(x=>({id:x.id||uid(), day:x.day, start:x.start, end:x.end, room:x.room}))});
  } else if(type==="item"){
    const old = state.items.find(i=>i.id===id), blk = isBlockKind(d.kind);
    upsert(state.items, {id, kind:d.kind, title:d.title, classId:d.course, due:d.date, time:d.time,
      duration: blk ? d.duration : undefined, room: blk ? d.location : "", priority: d.important ? "high" : "normal",
      notes:d.notes, done:d.done, updatedAt:u, rev:((old&&old.rev)||0)+1});
  } else if(type==="special"){
    upsert(state.specialDays, {id, label:d.label, start:d.start, end:d.end, follows:d.follows, updatedAt:u});
    state.settings.termRev = (state.settings.termRev||0)+1;
  } else if(type==="block"){
    upsert(state.plan.blocks, {id, itemId:d.item, title:d.title, date:d.date, start:d.start, end:d.end, focus:d.focus, done:d.done, updatedAt:u});
  } else if(type==="prefs"){
    const st = state.settings;
    st.termStart = d.termStart; st.termEnd = d.termEnd; st.termRev = (st.termRev||0)+1;
    state.plan.summary = d.planSummary;
    Object.assign(st.planner, {wdFrom:d.wdFrom, wdTo:d.wdTo, weFrom:d.weFrom, weTo:d.weTo, maxMin:d.maxMin, session:d.session, horizon:d.horizon, notes:d.notes});
    st.updatedAt = u;
  }
}
function removeLocal(id, type){
  if(type==="course") state.classes = state.classes.filter(x=>x.id!==id);
  else if(type==="item") state.items = state.items.filter(x=>x.id!==id);
  else if(type==="special"){ state.specialDays = state.specialDays.filter(x=>x.id!==id); state.settings.termRev = (state.settings.termRev||0)+1; }
  else if(type==="block") state.plan.blocks = state.plan.blocks.filter(x=>x.id!==id);
}

/* ----- the sync itself: pull what changed elsewhere, then push what changed here ----- */
let syncBusy = false, syncAgain = false, syncTimer = null, retryTimer = null;
function schedulePush(){ scheduleSync(1500); }
function scheduleSync(ms){
  if(!connected()) return;
  if(syncUi.s!=="syncing") setStatus("pending");
  clearTimeout(syncTimer); syncTimer = setTimeout(runSync, ms ?? 1500);
}
async function runSync(){
  if(!connected()) return;
  if(syncBusy){ syncAgain = true; return; }
  syncBusy = true; clearTimeout(retryTimer); setStatus("syncing");
  try{
    const cache = acc.cache || (acc.cache = {});
    let local = localRecords(), changed = false;
    for(let page=0; page<100; page++){
      // Ask a few seconds back, so nothing saved at the same moment slips through.
      const since = acc.cursor ? new Date(Date.parse(acc.cursor) - 5000).toISOString() : "1970-01-01T00:00:00.000Z";
      const rows = await sbFetch(`/rest/v1/records?select=id,type,data,deleted,updated_at&updated_at=gt.${encodeURIComponent(since)}&order=updated_at.asc,id.asc&limit=500`) || [];
      for(const r of rows){
        const loc = local[r.id], c = cache[r.id];
        const locChanged = !!loc && (!c || c.h !== loc.h);
        if(r.deleted){
          if(loc && !locChanged){ removeLocal(r.id, loc.type); delete local[r.id]; changed = true; }
          if(!loc || !locChanged) delete cache[r.id];
          continue;
        }
        const d = canon(r.type, r.data);
        if(!validRecord(r.type, d)) continue;
        const h = JSON.stringify(d), ru = +(r.data && r.data.u) || 0;
        if(loc && loc.h === h){ cache[r.id] = {h, u:Math.max(ru, c ? c.u : 0), t:r.type}; continue; }
        if(!loc && c && c.h === h) continue;              // deleted here after this version: the deletion stands
        if(locChanged && loc.u >= ru) continue;          // this device's newer edit wins and goes up below
        applyRemote(r.id, r.type, d, ru);
        cache[r.id] = {h, u:ru, t:r.type};
        local[r.id] = {type:r.type, data:d, h, u:ru, obj:{}};
        changed = true;
      }
      if(rows.length) acc.cursor = rows[rows.length-1].updated_at;
      if(rows.length < 500) break;
    }
    saveAcc();
    if(changed){ saveLocal(); if(!document.querySelector("dialog[open]")) render(); }

    local = localRecords();
    const now = Date.now(), ups = [];
    for(const [id, rec] of Object.entries(local)){
      const c = cache[id];
      if((c && c.h === rec.h) || !validRecord(rec.type, rec.data)) continue;
      let u = rec.u;
      if(!(u > (c ? c.u : 0))){ u = now; rec.obj.updatedAt = now; }
      ups.push({row:{user_id:acc.userId, id, type:rec.type, data:Object.assign({}, rec.data, {u}), deleted:false}, h:rec.h, u, t:rec.type});
    }
    for(const [id, c] of Object.entries(cache)){
      if(!local[id]) ups.push({row:{user_id:acc.userId, id, type:c.t, data:{}, deleted:true}, del:true});
    }
    for(let i=0; i<ups.length; i+=200){
      const chunk = ups.slice(i, i+200);
      await sbFetch("/rest/v1/records?on_conflict=user_id,id", {method:"POST", prefer:"resolution=merge-duplicates,return=minimal", body:chunk.map(x=>x.row)});
      for(const x of chunk){ if(x.del) delete cache[x.row.id]; else cache[x.row.id] = {h:x.h, u:x.u, t:x.t}; }
      saveAcc();
    }
    if(ups.length) saveLocal();
    acc.lastSync = Date.now(); saveAcc();
    setStatus("ok");
  }catch(e){ handleSyncError(e); }
  finally{
    syncBusy = false;
    if(syncAgain){ syncAgain = false; scheduleSync(300); }
  }
}
function handleSyncError(e){
  clearTimeout(retryTimer);
  if(e.code==="offline"){ setStatus("offline"); return; }
  if(e.code==="config"){ setStatus("ok"); return; }
  if(e.code==="auth"){
    acc.access = ""; acc.refresh = ""; acc.lastUserId = acc.userId; acc.userId = null; saveAcc();
    setStatus("error", "You were signed out. Sign in again in Settings to keep syncing.");
    render(); return;
  }
  setStatus("error", "Couldn't reach your account. Trying again soon.");
  retryTimer = setTimeout(()=>scheduleSync(0), 30000);
}
function statusLine(){
  switch(syncUi.s){
    case "pending": case "syncing": return "Syncing your changes…";
    case "offline": return "You're offline. Changes will sync when you're back online.";
    case "error": return syncUi.msg || "Couldn't reach your account. Trying again soon.";
    default: {
      if(!acc.lastSync) return "Signed in.";
      const mins = Math.round((Date.now()-acc.lastSync)/6e4);
      return "Synced " + (mins<1 ? "just now" : mins<60 ? `${mins} min ago` : new Date(acc.lastSync).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"})) + ".";
    }
  }
}
function setStatus(s, msg){
  syncUi = {s, msg:msg||""};
  const chip = $("#syncChip");
  if(chip){
    chip.hidden = !connected() && s!=="error";
    chip.dataset.s = s;
    chip.textContent = {pending:"Saving…",syncing:"Syncing…",offline:"Offline",error:"Sync problem"}[s] || "Synced";
  }
  const line = $("#syncStatus"); if(line) line.textContent = statusLine();
}

/* ----- planner without AI, for people without a Gemini key ----- */
function simplePlan(ctx){
  const est = {homework:60, reading:60, assignment:180, project:300, exam:240};
  const busyBy = {}; ctx.busy.forEach(b=>(busyBy[b.date] = busyBy[b.date] || []).push(b));
  const used = {}, out = [];
  const tasks = ctx.tasks.filter(t=>t.type!=="event").sort((a,b)=>
    (a.due+(a.dueTime||"23:59")).localeCompare(b.due+(b.dueTime||"23:59")) || (b.important - a.important));
  for(const t of tasks){
    let left = Math.round((est[t.type]||60) * (t.important ? 4/3 : 1)), part = 1;
    for(const d of ctx.days){
      if(left<=0 || d.date > t.due) break;
      let m = toMin(d.from);
      if(d.date===ctx.today) m = Math.max(m, toMin(ctx.now) + 15);
      m = Math.ceil(m/15)*15;
      const end = toMin(d.to);
      while(left>0 && m+25<=end){
        const cap = ctx.maxMinutesPerDay - (used[d.date]||0); if(cap<25) break;
        const len = Math.min(ctx.sessionMinutes, left, cap, end-m); if(len<25) break;
        const b = {date:d.date, start:fromMin(m), end:fromMin(m+len)};
        const clash = (busyBy[d.date]||[]).some(x=>b.start<x.end && x.start<b.end) || out.some(x=>x.date===b.date && toMin(b.start) < toMin(x.end)+15 && toMin(x.start) < toMin(b.end)+15);
        if(clash || `${b.date} ${b.end}` > `${t.due} ${t.dueTime||"23:59"}`){ m += 15; continue; }
        out.push(Object.assign(b, {taskId:t.id, focus:`Part ${part++}`}));
        used[d.date] = (used[d.date]||0) + len; left -= len; m += len + 15;
      }
    }
  }
  return {summary: tasks.length ? `Start with ${tasks[0].title}. Your sessions are spread out so nothing piles up the night before.` : "", blocks:out};
}

function renderTabbar(){
  const order = state.settings.tabOrder, k = order.join(",");
  const nav = document.querySelector("nav.tabbar");
  if(k !== tabbarKey){
    tabbarKey = k;
    nav.innerHTML = order.map(t=>`<button role="tab" data-tab="${t}"><svg viewBox="0 0 24 24" aria-hidden="true">${TAB_META[t].icon}</svg><span>${TAB_META[t].label}</span></button>`).join("");

const PREFS_KEY = "calendarplanner:prefs";
let prefs = (()=>{ try{ return Object.assign({theme:"auto"}, JSON.parse(localStorage.getItem(PREFS_KEY))||{}); }catch(e){ return {theme:"auto"}; } })();
function applyTheme(){
  const root = document.documentElement, t = prefs.theme;
  if(t==="light" || t==="dark") root.setAttribute("data-theme", t); else root.removeAttribute("data-theme");
  const metas = document.querySelectorAll('meta[name="theme-color"]');
  metas.forEach(m=>{
    const isDark = (m.getAttribute("media")||"").includes("dark");
    m.setAttribute("content", t==="dark" ? "#000000" : t==="light" ? "#FFFFFF" : (isDark ? "#000000" : "#FFFFFF"));
  });
}
function setTheme(t){ prefs.theme = t; try{ localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); }catch(e){} applyTheme(); render(); }
function moveTab(key, dir){
  const o = state.settings.tabOrder.slice(), i = o.indexOf(key), j = i + dir;
  if(i<0 || j<0 || j>=o.length) return;
  [o[i], o[j]] = [o[j], o[i]];
  state.settings.tabOrder = o; commit(); render();
}

}

function heroSentence(open){
  const t = today();
  const overdue = open.filter(i=>dayDiff(parseYmd(i.due),t)<0);
  const weekCount = open.filter(i=>{const d=dayDiff(parseYmd(i.due),t); return d>=0 && d<=7;});
  const examsWeek = weekCount.filter(i=>i.kind==="exam").length;
  let h1, sub;
  if(!open.length){
    h1 = "Nothing due. Enjoy it.";
    sub = "Add homework, assignments or exams with the Add button.";
  } else if(overdue.length){
    h1 = overdue.length===1 ? `“${esc(overdue[0].title)}” is past its due date.` : `${overdue.length} things are past their due date.`;
    sub = overdue.length===1 ? "Check it off once it's handed in." : "Check them off once they're handed in.";
  } else {
    const n = open[0], c = classById(n.classId), w = relWhen(n);
    const whenTxt = w.text.startsWith("in ") ? w.text : w.text.toLowerCase().replace(/^today /,"today at ");
    const verb = isBlockKind(n.kind) ? "is" : "is due";
    h1 = `${esc(n.title)} ${verb} ${esc(whenTxt)}.`;
    sub = c ? `<span class="swatch" style="--c:${c.color}"></span>${esc(c.name)}` : "";
  }
  const tally = `${weekCount.length} due in the next 7 days` + (examsWeek ? `, including ${examsWeek} exam${examsWeek>1?"s":""}.` : ".");
  const line = open.length ? (sub ? sub + "&ensp;" : "") + tally : sub;
  return `<section class="hero"><h1>${h1}</h1><p>${line}</p></section>`;
}

function itemRow(it){
  const c = classById(it.classId), k = KINDS[it.kind] || KINDS.homework, w = relWhen(it);
  const due = parseYmd(it.due);
  const when = it.done ? "" : `<span class="when ${w.cls}">${esc(w.text)}</span>`;
  const sel = ui.selecting && ui.tab==="agenda", on = sel && ui.selected.has(it.id);
  return `<li class="item${it.done?" done":""}${on?" selected":""}" style="--c:${colorOf(it)}">
    ${sel ? `<input type="checkbox" class="check sel" data-select="${it.id}" ${on?"checked":""} aria-label="Select ${esc(it.title)}">`
          : `<input type="checkbox" class="check" data-done="${it.id}" ${it.done?"checked":""} aria-label="Mark ${esc(it.title)} as done">`}
    <button type="button" class="item-main" ${sel?`data-selecttoggle="${it.id}"`:`data-edit="${it.id}"`}>
      <span class="item-title">${kic(it.kind)}${esc(it.title)}${it.priority==="high"?' <span class="flag" title="Important">!</span>':""}</span>
      <span class="item-meta"><span>${c?esc(c.name):"No class"}</span><span>${k.label}</span><span>${fmtDate(due)}${it.time?", "+fmtTime(it.time):""}</span></span>
    </button>
    ${when}
  </li>`;
}

/* ---------- day view ---------- */
function dashboard(){
  const t = today(), now = new Date(), nowM = now.getHours()*60+now.getMinutes(), key = ymd(t);
  const classes = sessionsOn(t);
  const nextClass = classes.find(x=>toMin(x.s.end) > nowM);
  const weekDue = state.items.filter(i=>{ if(i.done) return false; const x = dayDiff(parseYmd(i.due),t); return x>=0 && x<=7; });
  const late = state.items.filter(i=>!i.done && dayDiff(parseYmd(i.due),t)<0).length;
  const exams = weekDue.filter(i=>i.kind==="exam").length;
  const blocks = state.plan.blocks.filter(b=>b.date===key && blockVisible(b));
  const done = blocks.filter(b=>b.done).length;
  const classNote = !classes.length ? "No classes" : !nextClass ? "All done for today"
    : `${toMin(nextClass.s.start)<=nowM?"Now":"Next"}: ${esc(nextClass.c.name)}, ${fmtTime(nextClass.s.start)}`;
  const dueNote = late ? `<span style="color:var(--danger);font-weight:700">${late} late</span>` : exams ? `Including ${exams} exam${exams>1?"s":""}` : weekDue.length ? "Next 7 days" : "Nothing due";
  return `<div class="tiles">
      <div class="tile"><span class="l">Classes today</span><span class="n">${classes.length}</span><small>${classNote}</small></div>
      <button type="button" class="tile" data-goto="agenda"><span class="l">Due this week</span><span class="n">${weekDue.length}</span><small>${dueNote}</small></button>
      <button type="button" class="tile" data-goto="ai"><span class="l">Study today</span><span class="n">${blocks.length ? `${done}/${blocks.length}` : "—"}</span>${blocks.length ? `<span class="bar"><i style="width:${Math.round(done/blocks.length*100)}%"></i></span>` : `<small>Plan it with AI</small>`}</button>
    </div>
    <div class="quick"><button class="qbtn" data-action="add-item">${ic("plus")}Deadline</button><button class="qbtn" data-action="plan">${ic("sparkles")}Plan my days</button><button class="qbtn" data-action="import">${ic("camera")}Import timetable</button><button class="qbtn" data-goto="month">${ic("calendar")}This month</button></div>`;
}
const toMin = t=>{ const [h,m] = String(t).split(":").map(Number); return h*60+m; };
const fromMin = n=>`${pad(Math.floor(n/60)%24)}:${pad(n%60)}`;
/** A study session shows if it's in the past, or its task still needs doing. */
function blockVisible(b){
  const it = state.items.find(i=>i.id===b.itemId);
  return b.date < ymd(today()) || (it && !it.done);
}
