<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161F" media="(prefers-color-scheme: dark)">
<title>Study Planner</title>
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="icon" type="image/png" href="icon-192.png?v=3">
<script>
/* Apply the saved theme before the page paints, so there's no flash. */
(function(){ try{ var t = (JSON.parse(localStorage.getItem("studyplanner:prefs"))||{}).theme;
  if(t==="light"||t==="dark"){ document.documentElement.setAttribute("data-theme", t);
    document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){ m.setAttribute("content", t==="dark"?"#12161F":"#F6F7F9"); }); }
}catch(e){} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F9; --surface:#FFFFFF; --ink:#182032; --muted:#5B6474; --line:#DDE1E8;
  --accent:#5B3FE8; --accent-ink:#FFFFFF; --danger:#C62F3A; --soft:#EDF0F5;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12161F; --surface:#1B212C; --ink:#E9EDF5; --muted:#9AA3B5; --line:#2A3242;
    --accent:#A58FFF; --accent-ink:#120D24; --danger:#FF6B74; --soft:#232A37; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12161F; --surface:#1B212C; --ink:#E9EDF5; --muted:#9AA3B5; --line:#2A3242;
  --accent:#A58FFF; --accent-ink:#120D24; --danger:#FF6B74; --soft:#232A37; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px calc(150px + env(safe-area-inset-bottom,0px))}

/* Header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0 8px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;flex:none;display:block;filter:drop-shadow(0 2px 6px rgba(160,60,200,.3))}

/* Hero */
.hero{padding:36px 0 28px;border-bottom:1px solid var(--line);margin-bottom:8px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,4.2vw,2.9rem);line-height:1.1;letter-spacing:-.02em;margin:0;max-width:22ch}
.hero p{margin:14px 0 0;color:var(--muted);font-size:1.05rem}
.hero .swatch{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--c);margin-right:.35em;vertical-align:.12em}

/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:18px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;font-weight:700;font-size:.9rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Agenda */
.group{margin-top:26px}
.group h2{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:0 0 6px;display:flex;align-items:baseline;gap:10px}
.group h2 .count{color:var(--muted);font-family:var(--body);font-weight:400;font-size:.9rem}
.group.overdue h2{color:var(--danger)}
ul.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:12px 4px 12px 0;border-bottom:1px solid var(--line);position:relative}
.item::before{content:"";width:6px;align-self:stretch;border-radius:3px;background:var(--c);position:absolute;left:0;top:10px;bottom:10px}
.item .check{margin-left:18px}
.check{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:7px;display:grid;place-content:center;background:var(--surface);flex:none}
.check:checked{background:var(--ink);border-color:var(--ink)}
.check:checked::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--paper);border-bottom:2.5px solid var(--paper);transform:rotate(-45deg) translate(1px,-1px)}
.item-main{border:0;background:none;text-align:left;padding:0;min-width:0}
.item-title{display:block;font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.item-meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:.9rem;margin-top:2px}
.item.done .item-title{text-decoration:line-through;color:var(--muted)}
.when{font-weight:700;font-size:.88rem;white-space:nowrap;padding:3px 10px;border-radius:999px;background:var(--soft)}
.when.urgent{background:var(--danger);color:#fff}
.when.soon{background:color-mix(in srgb,var(--c) 30%,var(--surface));color:var(--ink)}
.flag{color:var(--danger);font-weight:700}
details.done-group{margin-top:30px}
details.done-group summary{cursor:pointer;font-family:var(--display);font-weight:700;color:var(--muted)}

/* Empty */
.empty{padding:40px 0;max-width:520px}
.empty h2{font-family:var(--display);font-size:1.4rem;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 18px}
.row-actions{display:flex;gap:10px;flex-wrap:wrap}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:12px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:0;border-radius:18px;padding:16px 22px;font-weight:700;font-size:1rem;box-shadow:0 6px 20px rgba(20,30,80,.25);display:flex;align-items:center;gap:8px;z-index:5}
.fab span{font-size:1.4rem;line-height:1}

/* Week */
.week-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:26px 0 14px;flex-wrap:wrap}
.week-head h2{font-family:var(--display);font-size:1.5rem;margin:0}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:180px}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day h3{margin:0 0 8px;font-size:.85rem;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.day h3 b{font-family:var(--display);font-size:1.3rem;color:var(--ink)}
.slot{font-size:.84rem;padding:6px 8px;border-radius:8px;margin-bottom:6px;background:color-mix(in srgb,var(--c) 22%,var(--surface));border-left:4px solid var(--c);line-height:1.3;overflow-wrap:anywhere}
.slot.task{background:transparent;border:1px dashed var(--c);border-left:4px solid var(--c);text-align:left;width:100%;display:block}
.slot.task.is-done{opacity:.5;text-decoration:line-through}
.slot small{display:block;color:var(--muted)}
@media (max-width:860px){
  .week-grid{grid-template-columns:1fr}
  .day{min-height:0}
  .day:not(.has) .none{display:none}
}

/* Classes + sync panels */
.panel{padding:26px 0}
.panel h2{font-family:var(--display);font-size:1.5rem;margin:0 0 6px}
.panel > p{color:var(--muted);margin:0 0 18px;max-width:62ch}
.term{display:flex;gap:14px;flex-wrap:wrap;align-items:end;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:24px}
.term label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem}
.class-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.dot{width:18px;height:18px;border-radius:6px;background:var(--c)}
.class-row h3{margin:0;font-size:1.05rem}
.class-row p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.box{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:18px;margin-bottom:18px;max-width:680px}
.box h3{margin:0 0 10px;font-family:var(--display);font-size:1.15rem}
.box p{margin:0 0 12px;color:var(--muted)}
.opt{display:flex;gap:10px;align-items:center;padding:6px 0}
.opt input[type=checkbox],.opt input[type=radio]{flex:none;width:18px;height:18px;accent-color:var(--accent)}
.remind{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;margin:8px 0 14px}
ol.steps{margin:0 0 4px;padding-left:1.3em;color:var(--muted)}
ol.steps li{margin-bottom:4px}

/* Forms / dialog */
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,14,25,.45)}
dialog form,dialog .dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
dialog{overflow:auto}
dialog:focus,dialog:focus-visible{outline:none}
dialog .dlg p{margin:0}
.emoji{font-size:1.2rem;width:18px;text-align:center}
.slot.special{background:transparent;border:1px solid var(--line);border-left:4px solid var(--muted)}
.drop{display:block;position:relative;border:2px dashed var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;background:var(--paper)}
.drop:hover,.drop:focus-within{border-color:var(--accent)}
.drop b{display:block;font-family:var(--display);font-size:1.05rem}
.drop > span{display:block;color:var(--muted);font-size:.9rem}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs:empty{display:none}
.thumb{position:relative;width:68px;height:68px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:.72rem;text-align:center;padding:4px;overflow-wrap:anywhere}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:.95rem;line-height:1;padding:0;z-index:1}
.review h3{font-family:var(--display);font-size:1.02rem;margin:8px 0 0}
.pick{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pick input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.pick small{display:block;color:var(--muted);font-size:.88rem}
.tag{font-size:.75rem;font-weight:700;background:var(--soft);border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.loading{padding:26px 0;text-align:center}
.loading .bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin:18px auto 0;max-width:240px}
.loading .bar i{display:block;height:100%;width:40%;background:var(--accent);border-radius:3px;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.ai-note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.9rem}
dialog h2{margin:0;font-family:var(--display);font-size:1.35rem}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-weight:700;font-size:.9rem}
.field .hint{font-weight:400;color:var(--muted);font-size:.85rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kinds{display:flex;gap:6px;flex-wrap:wrap}
.kinds label{position:relative}
.kinds input{position:absolute;opacity:0;inset:0}
.kinds span{display:block;border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-weight:700;font-size:.9rem;cursor:pointer}
.kinds input:checked + span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kinds input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors label{position:relative}
.colors input{position:absolute;opacity:0;inset:0}
.colors span{display:block;width:32px;height:32px;border-radius:10px;background:var(--c);border:3px solid transparent;cursor:pointer}
.colors input:checked + span{border-color:var(--ink)}
.colors input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.session{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr auto;gap:8px;align-items:center}
.session button{border:0;background:none;color:var(--muted);font-size:1.3rem;padding:4px 8px}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.foot .right{display:flex;gap:10px;margin-left:auto}
.error{color:var(--danger);font-weight:700;font-size:.9rem;margin:0}
@media (max-width:520px){
  .two{grid-template-columns:1fr}
  .session{grid-template-columns:1fr 1fr;}
  .session .room{grid-column:1 / 2}
}


.top-left{display:flex;align-items:center;gap:12px}
.sync-chip{border:0;background:var(--soft);color:var(--muted);font-weight:700;font-size:.8rem;padding:4px 10px 4px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.sync-chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dotc,#39C27A)}
.sync-chip[data-s="pending"],.sync-chip[data-s="syncing"]{--dotc:#F5C518}
.sync-chip[data-s="offline"]{--dotc:#9AA3B5}
.sync-chip[data-s="error"]{--dotc:var(--danger);color:var(--danger)}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:12px 14px;margin-top:16px}
.banner p{margin:0}
.key-row{display:flex;gap:10px;margin:12px 0 8px}
.key-row input{flex:1}
.fine{font-size:.9rem;color:var(--muted)}
.status{font-weight:700;color:var(--ink)!important}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline}
a.btn{text-decoration:none;display:inline-block;color:inherit}
a.btn.primary{color:var(--accent-ink)}
.box a{color:var(--accent)}
/* Day view */
.day-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:28px 0 16px}
.day-title{font-family:var(--display);font-weight:800;font-size:clamp(2.1rem,7vw,3.2rem);letter-spacing:-.025em;line-height:1;margin:0}
.day-sub{margin:6px 0 0;color:var(--muted);font-size:1.05rem}
.day-head .btn{min-width:44px}
.coach{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.coach p{margin:0}
.coach-label{font-weight:700;font-size:.78rem;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.special-banner{background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.section-label{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:22px 0 6px}
ul.timeline{list-style:none;margin:0;padding:0}
.tl{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:5px 0}
.tl-time b{white-space:nowrap}
.tl-time{text-align:right;padding-top:10px;font-size:.88rem;line-height:1.25}
.tl-time small{display:block;color:var(--muted)}
.tl-body{border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--c) 20%,var(--surface));border:0;border-left:5px solid var(--c);display:flex;gap:10px;align-items:center;min-width:0;width:100%;text-align:left}
.tl-body .txt{flex:1;min-width:0}
.tl-body b{display:block;overflow-wrap:anywhere}
.tl-body small{display:block;color:var(--muted);font-size:.86rem}
.tl.study .tl-body{background:var(--surface);border:1px dashed var(--c);border-left:5px solid var(--c)}
.tl.due .tl-body,.tl.exam .tl-body{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c)}
.tl.past{opacity:.55}
.tl.now .tl-body{box-shadow:0 0 0 2px var(--accent)}
.tl.now .tl-time b{color:var(--accent)}
.tl.done .txt b{text-decoration:line-through;color:var(--muted)}
.xbtn{border:0;background:none;color:var(--muted);font-size:1.3rem;line-height:1;padding:2px 6px}
.day-link{border:0;background:none;padding:0;width:100%;display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-weight:700;font-size:.85rem;cursor:pointer}
.day-link b{font-family:var(--display);font-size:1.3rem;color:var(--ink)}
.slot.study.is-done{opacity:.5;text-decoration:line-through}
.slot.study{background:transparent;border:1px dashed var(--c);border-left:4px solid var(--c);text-align:left;width:100%;display:block}
.plan-row{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.plan-row small{display:block;color:var(--muted);font-size:.88rem}
.pdot{width:12px;height:12px;border-radius:4px;margin-top:6px;background:var(--c)}
/* Welcome */
.welcome{padding:30px 0;max-width:620px}
.welcome h1{font-family:var(--display);font-size:clamp(1.9rem,6vw,2.7rem);letter-spacing:-.02em;line-height:1.05;margin:0 0 6px}
.welcome > p{color:var(--muted);margin:0 0 22px;font-size:1.05rem}
.welcome-steps{list-style:none;counter-reset:w;padding:0;margin:0 0 20px;display:flex;flex-direction:column;gap:18px}
.welcome-steps li{counter-increment:w;display:grid;grid-template-columns:34px 1fr;gap:12px}
.welcome-steps li::before{content:counter(w);width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:800;font-family:var(--display)}
.welcome-steps b{font-family:var(--display);font-size:1.1rem}
.welcome-steps p{margin:2px 0 10px;color:var(--muted)}
/* Tab bar: bottom on phones, sidebar on wide screens */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(18px);backdrop-filter:saturate(1.8) blur(18px);border-top:1px solid var(--line);padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 3px;color:var(--muted);font-size:.66rem;font-weight:700;border-radius:12px;min-width:0}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar button[aria-selected="true"] svg{stroke-width:2.3}
.tabbar button[data-tab="ai"] svg{color:inherit}
@media (min-width:900px){
  .tabbar{top:0;bottom:0;right:auto;width:210px;grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;gap:4px;padding:84px 14px 20px;border-top:0;border-right:1px solid var(--line)}
  .tabbar button{flex-direction:row;gap:12px;font-size:.98rem;padding:10px 14px;justify-content:flex-start}
  .tabbar button[aria-selected="true"]{background:var(--soft);color:var(--ink)}
  .tabbar button[aria-selected="true"] svg{color:var(--accent)}
  .wrap{margin-left:210px;padding-left:36px;padding-right:36px}
  .fab{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:90px}
}
/* Page heads */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:26px 0 16px}

/* Dashboard */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:2px 0 12px}

.tile small{font-size:.78rem;color:var(--muted);line-height:1.25;overflow-wrap:anywhere}
.tile .bar{display:block;height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:4px}

.quick{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem}
.qbtn:hover{border-color:var(--accent)}
/* Month */
.mhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.mhead span{font-size:.75rem;font-weight:700;color:var(--muted);text-align:center}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mcell{min-height:104px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden;color:inherit;font:inherit;cursor:pointer}
.mcell:hover{border-color:var(--accent)}
.mcell.out{opacity:.38}
.mcell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mcell.today .mnum{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 6px}
.mcell.off{background:var(--soft)}
.mnum{font-family:var(--display);font-weight:800;font-size:.95rem;align-self:flex-start}
.mitems{display:flex;flex-direction:column;gap:3px;min-width:0}

.mmore,.mstudy,.moff{font-size:.72rem;color:var(--muted);font-weight:700}
@media (max-width:640px){
  .mgrid,.mhead{gap:3px}
  .mcell{min-height:62px;padding:4px;border-radius:9px}
  .mnum{font-size:.85rem}

/* AI page */
.ai-hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface) 70%);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;max-width:720px}

.sess .txt{flex:1;min-width:0}
.sess b{display:block;overflow-wrap:anywhere}
.sess small{display:block;color:var(--muted);font-size:.86rem}
.sess.done b{text-decoration:line-through;color:var(--muted)}
.tool{display:flex;gap:14px;align-items:flex-start;width:100%;max-width:720px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:inherit;font:inherit;cursor:pointer}

/* Selecting items to share */
.filters .spacer{flex:1}

.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:12;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);border-radius:16px;padding:8px 8px 8px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:min(560px,calc(100vw - 24px))}

/* Settings: theme and page order */
.seg{display:inline-flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;flex-wrap:wrap}

ol.order{list-style:none;margin:0 0 10px;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
ol.order li{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
ol.order li:last-child{border-bottom:0}
ol.order li span:not(.tag){flex:1;font-weight:700}
ol.order svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--accent)}
.obtn{border:1px solid var(--line);background:var(--paper);width:38px;height:38px;border-radius:10px;font-size:1.1rem;font-weight:700}
.obtn:disabled{opacity:.3;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:20}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
"use strict";
const KEY = "studyplanner:v1";
const SYNC_KEY = "studyplanner:sync";
const BANNER_KEY = "studyplanner:installHint";
const API = "https://api.github.com";
const GIST_DESC = "Study Planner sync";
const DATA_FILE = "study-planner.json";
const ICS_FILE = "school.ics";
const COLORS = ["#F5C518","#FF6FA3","#39C27A","#3FA7F5","#FF8A3D","#9B7BFF","#1FBFB8","#E5484D"];
const KINDS = {
  homework:{label:"Homework",icon:"📝"},
  assignment:{label:"Assignment",icon:"📄"},
  project:{label:"Project",icon:"🧩"},
  reading:{label:"Reading",icon:"📖"},
  exam:{label:"Exam",icon:"🧪"}
};
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAYS_LONG = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const NOCLASS = "#9AA3B5";

/* ---------- local storage ---------- */
function blank(){
  return {classes:[],items:[],specialDays:[],plan:{createdAt:0,summary:"",blocks:[]},meta:{updatedAt:0},
    settings:{termStart:"",termEnd:"",termRev:0,remindTask:1440,remindExam:1440,remindClass:0,remindStudy:15,incTasks:true,incExams:true,incClasses:true,incStudy:true,
      tabOrder:["day","agenda","week","month","ai","classes","sync"],
      planner:{wdFrom:"16:00",wdTo:"22:00",weFrom:"10:00",weTo:"18:00",maxMin:180,session:45,horizon:7,notes:""}}};
}
const TAB_KEYS = ["day","agenda","week","month","ai","classes","sync"];
function cleanOrder(o){
  const seen = new Set(), out = [];
  (Array.isArray(o)?o:[]).forEach(k=>{ if(TAB_KEYS.includes(k) && !seen.has(k)){ seen.add(k); out.push(k); } });
  TAB_KEYS.forEach(k=>{ if(!seen.has(k)) out.push(k); });
  return out;
}
function normalize(d){
  const b = blank();
  return {
    classes: Array.isArray(d.classes) ? d.classes : [],
    items: Array.isArray(d.items) ? d.items : [],
    specialDays: Array.isArray(d.specialDays) ? d.specialDays : [],
    plan: Object.assign(b.plan, d.plan || {}),
    meta: Object.assign(b.meta, d.meta || {}),
    settings: Object.assign(b.settings, d.settings || {}, {planner: Object.assign(b.settings.planner, (d.settings||{}).planner || {}),
      tabOrder: cleanOrder((d.settings||{}).tabOrder)})
  };
}
function load(){
  try{ const s = localStorage.getItem(KEY); if(s) return normalize(JSON.parse(s)); }catch(e){}
  return blank();
}
let storageWarned = false;
function saveLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ if(!storageWarned){ storageWarned = true; toast("This device isn't keeping your data. Turn on sync or save a backup."); } }
}
/** Every user change goes through here: save, then sync. */
function commit(){
  state.meta.updatedAt = Date.now();
  saveLocal();
  schedulePush();
}
let state = load();

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc = s=>String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n=>String(n).padStart(2,"0");
const ymd = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s=>{ const [y,m,d]=String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); };
const today = ()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const dayDiff = (a,b)=>Math.round((Date.UTC(a.getFullYear(),a.getMonth(),a.getDate())-Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()))/864e5);
const isoDay = d=>(d.getDay()+6)%7+1; // Mon=1..Sun=7
const mondayOf = d=>addDays(d,1-isoDay(d));
const withTime = (d,t)=>{ const [h,m]=String(t||"23:59").split(":").map(Number); const x=new Date(d); x.setHours(h||0,m||0,0,0); return x; };
const dueAt = it=>withTime(parseYmd(it.due), it.time || "23:59");
const fmtDate = d=>d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const fmtTime = t=>{ if(!t) return ""; return withTime(new Date(),t).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); };
const classById = id=>state.classes.find(c=>c.id===id);
const colorOf = it=>{ const c=classById(it.classId); return c ? c.color : NOCLASS; };
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const isStandalone = navigator.standalone===true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);

function relWhen(it){
  const diff = dayDiff(parseYmd(it.due), today());
  if(diff < 0) return {text: diff===-1 ? "1 day late" : `${-diff} days late`, cls:"urgent"};
  if(diff === 0) return {text: it.time ? `Today ${fmtTime(it.time)}` : "Today", cls:"urgent"};
  if(diff === 1) return {text:"Tomorrow", cls:"soon"};
  return {text:`in ${diff} days`, cls: diff<=3 ? "soon" : ""};
}

let toastTimer;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),3000);
}

/* =========================================================
   LIVE SYNC
   Two secret GitHub gists:
   - the calendar gist holds school.ics, the link Apple Calendar subscribes to;
   - the data gist holds study-planner.json and settings.json (your Gemini key),
     so your iPhone, iPad and Mac share everything. Its link is never shared.
   ========================================================= */
function loadSync(){ try{ return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; }catch(e){ return {}; } }
function saveSync(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); }catch(e){} }
let sync = loadSync();              // {token, login, gistId, lastSync, dirty, dirtyAt, needsKey}
let syncUi = {s: connected() ? "ok" : "off", msg:""};
function connected(){ return !!(sync && sync.token && sync.gistId); }
function feedUrl(){ return `https://gist.githubusercontent.com/${sync.login}/${sync.gistId}/raw/${ICS_FILE}`; }

async function gh(path, opts={}){
  let res;
  try{
    res = await fetch(API+path, Object.assign({}, opts, {cache:"no-store", headers:Object.assign({
      "Accept":"application/vnd.github+json",
      "Authorization":"Bearer "+sync.token,
      "X-GitHub-Api-Version":"2022-11-28"
    }, opts.body ? {"Content-Type":"application/json"} : {})}));
  }catch(e){ const err = new Error("offline"); err.code = "offline"; throw err; }
  if(res.status===401){ const e=new Error("auth"); e.code="auth"; throw e; }
  if(res.status===404){ const e=new Error("missing"); e.code="missing"; throw e; }
  if(!res.ok){ const e=new Error("http "+res.status); e.code="http"; e.status=res.status; throw e; }
  return res.status===204 ? null : res.json();
}
const DATA_DESC = "Study Planner data (private)";
const SETTINGS_FILE = "settings.json";
const tagGist = (p, which)=>p.catch(e=>{ e.which = which; throw e; });
async function listGists(){
  const all = [];
  for(let page=1; page<=5; page++){
    const list = await gh(`/gists?per_page=100&page=${page}`);
    all.push(...list);
    if(list.length < 100) break;
  }
  return all;
}
async function readGistFile(g, name){
  const f = g.files && g.files[name];
  if(!f) return null;
  if(f.truncated){ const r = await fetch(f.raw_url,{cache:"no-store"}); return r.text(); }
  return f.content;
}
function settingsPayload(){ return {geminiKey: ai.key || "", keyUpdatedAt: ai.updatedAt || 0}; }
function applyRemoteSettings(st){
  if(st && st.geminiKey && (+st.keyUpdatedAt||0) > (ai.updatedAt||0)){
    ai = {key: st.geminiKey, updatedAt: +st.keyUpdatedAt||Date.now()}; saveAi();
  }
}
/**
 * Private data lives in its own gist, separate from the calendar gist whose link
 * is shared with Apple Calendar. Older versions kept both in one gist; this moves
 * the data out. Returns "found", "legacy" or "new".
 */
async function ensureDataGist(list){
  if(sync.dataGistId) return "found";
  list = list || await listGists();
  const found = list.find(g=>g.description===DATA_DESC && g.files && g.files[DATA_FILE]);
  if(found){ sync.dataGistId = found.id; saveSync(); return "found"; }
  let legacy = null;
  if(sync.gistId){
    try{ legacy = await readGistFile(await gh(`/gists/${sync.gistId}`), DATA_FILE); }
    catch(e){ if(e.code!=="missing") throw e; }
  }
  const g = await gh("/gists", {method:"POST", body:JSON.stringify({description:DATA_DESC, public:false, files:{
    [DATA_FILE]:{content: legacy || JSON.stringify(state)},
    [SETTINGS_FILE]:{content: JSON.stringify(settingsPayload())}}})});
  sync.dataGistId = g.id; saveSync();
  if(legacy){ try{ await gh(`/gists/${sync.gistId}`, {method:"PATCH", body:JSON.stringify({files:{[DATA_FILE]:null}})}); }catch(e){} }
  return legacy ? "legacy" : "new";
}
async function fetchRemote(){
  const g = await tagGist(gh(`/gists/${sync.dataGistId}`), "data");
  let data = null, settings = null;
  try{ const t = await readGistFile(g, DATA_FILE); if(t) data = normalize(JSON.parse(t)); }catch(e){}
  try{ const t = await readGistFile(g, SETTINGS_FILE); if(t) settings = JSON.parse(t); }catch(e){}
  return {data, settings};
}
const hasData = d=>d && (d.items.length || d.classes.length);

function statusLine(){
  switch(syncUi.s){
    case "pending": case "syncing": return "Saving your changes…";
    case "offline": return "You're offline. Changes will sync when you're back online.";
    case "error": return syncUi.msg || "Couldn't reach GitHub. Trying again soon.";
    default: {
      if(!sync.lastSync) return "Connected.";
      const mins = Math.round((Date.now()-sync.lastSync)/6e4);
      return "Synced " + (mins<1 ? "just now" : mins<60 ? `${mins} min ago` : new Date(sync.lastSync).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"})) + ".";
    }
  }
}
function setStatus(s, msg){
  syncUi = {s, msg:msg||""};
  const chip = $("#syncChip");
  if(chip){
    chip.hidden = !connected();
    chip.dataset.s = s;
    chip.textContent = {pending:"Saving…",syncing:"Syncing…",offline:"Offline",error:"Sync problem"}[s] || "Synced";
  }
  const line = $("#syncStatus"); if(line) line.textContent = statusLine();
}

let pushTimer = null, pushing = false, retryTimer = null;
function schedulePush(){
  if(!connected()) return;
  sync.dirty = true; sync.dirtyAt = Date.now(); saveSync();
  setStatus("pending");
  clearTimeout(pushTimer); pushTimer = setTimeout(push, 1500);
}
async function push(){
  if(!connected()) return;
  if(pushing){ clearTimeout(pushTimer); pushTimer = setTimeout(push, 1500); return; }
  pushing = true; setStatus("syncing");
  const started = Date.now();
  try{
    await ensureDataGist();
    const files = {[DATA_FILE]:{content:JSON.stringify(state)}};
    if(sync.settingsDirty) files[SETTINGS_FILE] = {content:JSON.stringify(settingsPayload())};
    await tagGist(gh(`/gists/${sync.dataGistId}`, {method:"PATCH", body:JSON.stringify({files})}), "data");
    await tagGist(gh(`/gists/${sync.gistId}`, {method:"PATCH", body:JSON.stringify({files:{[ICS_FILE]:{content:buildFeed()}}})}), "cal");
    if((sync.dirtyAt||0) <= started) sync.dirty = false;
    if(files[SETTINGS_FILE] && (ai.updatedAt||0) <= started) sync.settingsDirty = false;
    sync.lastSync = Date.now(); sync.needsKey = false; saveSync();
    setStatus(sync.dirty ? "pending" : "ok");
  }catch(e){ handleSyncError(e); }
  finally{ pushing = false; }
}
async function pull(){
  if(!connected() || pushing) return;
  try{
    setStatus("syncing");
    await ensureDataGist();
    const remote = await fetchRemote();
    applyRemoteSettings(remote.settings);
    const r = remote.data ? (remote.data.meta.updatedAt||0) : 0, l = state.meta.updatedAt||0;
    if(remote.data && r > l && !sync.dirty){
      state = remote.data; saveLocal(); render();
    } else if(sync.dirty || sync.settingsDirty || l > r){
      await push(); return;
    }
    sync.lastSync = Date.now(); saveSync(); setStatus("ok");
  }catch(e){ handleSyncError(e); }
}
function handleSyncError(e){
  clearTimeout(retryTimer);
  if(e.code==="offline"){ setStatus("offline"); return; }
  if(e.code==="auth"){
    sync.needsKey = true; saveSync();
    setStatus("error","Your GitHub key expired or was removed. Paste a new one in Settings.");
    if(ui.tab==="sync") render();
    return;
  }
  if(e.code==="missing" && e.which==="data"){
    // The private data file was deleted: make a new one from this device and carry on.
    sync.dataGistId = null; sync.dirty = true; saveSync();
    retryTimer = setTimeout(push, 1000); return;
  }
  if(e.code==="missing"){
    sync.gistId = null; saveSync();
    setStatus("error","The calendar file on GitHub was deleted. Connect again to make a new one, then subscribe again in Apple Calendar.");
    render(); return;
  }
  setStatus("error","Couldn't reach GitHub. Trying again soon.");
  retryTimer = setTimeout(()=>{ sync.dirty ? push() : pull(); }, 30000);
}

async function connect(token, keepGist){
  token = (token||"").trim();
  if(!token){ setStatus("error","Paste your GitHub key first."); render(); return; }
  const prev = sync;
  sync = keepGist ? Object.assign({}, prev, {token}) : {token};
  setStatus("syncing"); render();
  try{
    const me = await gh("/user");
    sync.login = me.login;
    if(keepGist && sync.gistId){ sync.needsKey = false; saveSync(); await pull(); toast("Key updated"); render(); return; }
    const list = await listGists();
    const cal = list.find(g=>g.description===GIST_DESC && g.files && g.files[ICS_FILE]);
    if(cal) sync.gistId = cal.id;
    else {
      const g = await gh("/gists", {method:"POST", body:JSON.stringify({description:GIST_DESC, public:false, files:{[ICS_FILE]:{content:buildFeed()}}})});
      sync.gistId = g.id;
      if(g.owner && g.owner.login) sync.login = g.owner.login;
    }
    saveSync();
    const how = await ensureDataGist(list);
    if(how !== "new"){
      const remote = await fetchRemote();
      applyRemoteSettings(remote.settings);
      if(hasData(remote.data)){
        const useRemote = !hasData(state) || confirm(`Found your planner on GitHub (${remote.data.items.length} deadlines, ${remote.data.classes.length} classes). Load it on this device?\n\nCancel keeps what's on this device and replaces the GitHub copy.`);
        if(useRemote){ state = remote.data; saveLocal(); }
      }
    }
    if(ai.key && how==="new") sync.settingsDirty = true;
    sync.dirty = true; sync.dirtyAt = Date.now(); saveSync();
    await push();
    render();
    toast(hasData(state) ? "Connected. Your planner is synced." : "Connected. Now subscribe in Apple Calendar.");
    return;
  }catch(e){
    const msg = e.code==="auth" ? "GitHub didn't accept that key. Check you copied all of it and that the gist box was ticked."
      : e.code==="offline" ? "You're offline. Connect once you're back online."
      : "Couldn't connect to GitHub. Try again in a minute.";
    sync = keepGist ? Object.assign(prev,{needsKey:true}) : {};
    saveSync(); setStatus("error", msg);
  }
  render();
}
function disconnect(){
  if(!confirm("Stop syncing on this device?\n\nYour Apple Calendar subscription keeps showing the last synced version, and your data stays on GitHub.")) return;
  sync = {}; saveSync(); setStatus("off"); render(); toast("Sync turned off on this device");
}

  const root = document.documentElement, t = prefs.theme;

  const metas = document.querySelectorAll('meta[name="theme-color"]');

    m.setAttribute("content", t==="dark" ? "#12161F" : t==="light" ? "#F6F7F9" : (isDark ? "#12161F" : "#F6F7F9"));

function heroSentence(open){
  const t = today();
  const overdue = open.filter(i=>dayDiff(parseYmd(i.due),t)<0);
  const weekCount = open.filter(i=>{const d=dayDiff(parseYmd(i.due),t); return d>=0 && d<=7;});
  const examsWeek = weekCount.filter(i=>i.kind==="exam").length;
  let h1, sub;
  if(!open.length){
    h1 = "Nothing due. Enjoy it.";
    sub = "Add homework, assignments or exams with the Add button.";
  } else if(overdue.length){
    h1 = overdue.length===1 ? `“${esc(overdue[0].title)}” is past its due date.` : `${overdue.length} things are past their due date.`;
    sub = overdue.length===1 ? "Check it off once it's handed in." : "Check them off once they're handed in.";
  } else {
    const n = open[0], c = classById(n.classId), w = relWhen(n);
    const whenTxt = w.text.startsWith("in ") ? w.text : w.text.toLowerCase().replace(/^today /,"today at ");
    const verb = n.kind==="exam" ? "is" : "is due";
    h1 = `${esc(n.title)} ${verb} ${esc(whenTxt)}.`;
    sub = c ? `<span class="swatch" style="--c:${c.color}"></span>${esc(c.name)}` : "";
  }
  const tally = `${weekCount.length} due in the next 7 days` + (examsWeek ? `, including ${examsWeek} exam${examsWeek>1?"s":""}.` : ".");
  const line = open.length ? (sub ? sub + "&ensp;" : "") + tally : sub;
  return `<section class="hero"><h1>${h1}</h1><p>${line}</p></section>`;
}

function dashboard(){
  const t = today(), now = new Date(), nowM = now.getHours()*60+now.getMinutes(), key = ymd(t);
  const classes = sessionsOn(t);
  const nextClass = classes.find(x=>toMin(x.s.end) > nowM);
  const weekDue = state.items.filter(i=>{ if(i.done) return false; const x = dayDiff(parseYmd(i.due),t); return x>=0 && x<=7; });
  const late = state.items.filter(i=>!i.done && dayDiff(parseYmd(i.due),t)<0).length;
  const exams = weekDue.filter(i=>i.kind==="exam").length;
  const blocks = state.plan.blocks.filter(b=>b.date===key && blockVisible(b));

  const dueNote = late ? `<span style="color:var(--danger);font-weight:700">${late} late</span>` : exams ? `Including ${exams} exam${exams>1?"s":""}` : weekDue.length ? "Next 7 days" : "Nothing due";
  return `<div class="tiles">

    const it = state.items.find(i=>i.id===b.itemId), c = it && classById(it.classId);
    entries.push({start:b.start, end:b.end, kind:"study", color: it ? colorOf(it) : NOCLASS, done:b.done,
      body:`<div class="tl-body"><input type="checkbox" class="check" data-blockdone="${b.id}" ${b.done?"checked":""} aria-label="Mark this study session done">
        <div class="txt"><b>📚 ${esc(b.title)}</b><small>${esc(b.focus || "Study session")}${c?" · "+esc(c.name):""}</small></div>
        <button type="button" class="xbtn" data-blockdel="${b.id}" aria-label="Remove this study session">×</button></div>`});
  }
  entries.sort((a,b)=>a.start.localeCompare(b.start));

  if(allDay.length){
    h += `<h2 class="section-label">${diff===0?"Due today":"Due this day"}</h2><ul class="items">${allDay.map(itemRow).join("")}</ul>`;
  }
  h += `<h2 class="section-label">Schedule</h2>`;
  if(entries.length){
    const now = new Date(), nowM = now.getHours()*60+now.getMinutes();
    h += `<ul class="timeline">` + entries.map(e=>{
      let state_ = "";
      if(diff<0) state_ = " past";
      else if(diff===0){
        const s = toMin(e.start), en = e.end ? toMin(e.end) : s;
        if(en < nowM) state_ = " past"; else if(s <= nowM && nowM < en) state_ = " now";
      }
      return `<li class="tl ${e.kind}${state_}${e.done?" done":""}" style="--c:${e.color}"><div class="tl-time"><b>${fmtTime(e.start)}</b>${e.end?`<small>${fmtTime(e.end)}</small>`:""}</div>${e.body}</li>`;
    }).join("") + `</ul>`;
  } else {
    h += `<p class="fine">Nothing scheduled${diff>=0?". A good day to get ahead.":"."}</p>`;
  }

  if(diff===0){
    const soon = state.items.filter(i=>{ if(i.done) return false; const x = dayDiff(parseYmd(i.due),t); return x>=1 && x<=3; }).sort((a,b)=>dueAt(a)-dueAt(b));
    const late = state.items.filter(i=>!i.done && dayDiff(parseYmd(i.due),t)<0);
    if(late.length) h += `<h2 class="section-label" style="color:var(--danger)">Late</h2><ul class="items">${late.map(itemRow).join("")}</ul>`;
    if(soon.length) h += `<h2 class="section-label">Coming up</h2><ul class="items">${soon.map(itemRow).join("")}</ul>`;
  }
  return h;
}

function renderAgenda(){
  const banner = installBanner();
  if(!state.items.length && !state.classes.length) return banner + welcomeHtml();
  const f = ui.filter;
  const match = i => f==="all" || (f==="exam" ? i.kind==="exam" : i.kind!=="exam");
  const open = state.items.filter(i=>!i.done && match(i)).sort((a,b)=>dueAt(a)-dueAt(b));
  const done = state.items.filter(i=>i.done && match(i)).sort((a,b)=>dueAt(b)-dueAt(a));
  const t = today();
  const groups = [["Late","overdue",d=>d<0],["Today","",d=>d===0],["Tomorrow","",d=>d===1],["This week","",d=>d>=2&&d<=7],["Later","",d=>d>7]];
  let html = banner + heroSentence(open);
  html += `<div class="filters" role="group" aria-label="Show">
    ${[["all","Everything"],["tasks","Homework & assignments"],["exam","Exams"]].map(([k,l])=>`<button class="chip" data-filter="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}
    <span class="spacer"></span>
    ${ui.selecting ? "" : `<button class="chip" data-action="sel-start">↗ Share with a friend</button><button class="chip" data-action="from-friend">↙ Add from a friend</button>`}
  </div>`;
  if(ui.selecting) html += `<div class="selbar" role="region" aria-label="Sharing"><span class="count">${ui.selected.size ? ui.selected.size+" selected" : "Tap items to share"}</span>
    <button class="btn ghost" data-action="sel-cancel">Cancel</button><button class="btn primary" data-action="sel-share" ${ui.selected.size?"":"disabled"}>Share</button></div>`;
  for(const [label,cls,test] of groups){
    const list = open.filter(i=>test(dayDiff(parseYmd(i.due),t)));
    if(!list.length) continue;
    html += `<section class="group ${cls}"><h2>${label} <span class="count">${list.length}</span></h2><ul class="items">${list.map(itemRow).join("")}</ul></section>`;
  }
  if(!open.length && state.items.length){
    html += `<section class="empty"><p>Nothing open here. Tap Add to put in your next deadline.</p></section>`;
  }
  if(done.length){
    html += `<details class="done-group"><summary>Done (${done.length})</summary><ul class="items">${done.map(itemRow).join("")}</ul></details>`;
  }
  return html;
}

function inTerm(d){
  const s = state.settings;
  if(s.termStart && d < parseYmd(s.termStart)) return false;
  if(s.termEnd && d > parseYmd(s.termEnd)) return false;
  return true;
}

/** A day off or a schedule swap covering this date, if any (swaps win). */
function specialFor(d){
  const k = ymd(d);
  const list = state.specialDays.filter(x=>k>=x.start && k<=(x.end||x.start));
  return list.find(x=>+x.follows) || list[0] || null;
}
/** The class meetings that actually happen on this date. */
function sessionsOn(d){
  if(!inTerm(d)) return [];
  const sp = specialFor(d);
  if(sp && !+sp.follows) return [];
  const day = sp ? +sp.follows : isoDay(d);
  const out = [];
  for(const c of state.classes) for(const s of (c.sessions||[])) if(+s.day===day) out.push({c,s});
  return out.sort((a,b)=>a.s.start.localeCompare(b.s.start));
}
const fmtRange = (a,b)=> (!b || a===b) ? fmtDate(parseYmd(a)) : `${fmtDate(parseYmd(a))} – ${fmtDate(parseYmd(b))}`;
const normName = n=>String(n||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();

function renderWeek(){
  const start = ui.weekStart, end = addDays(start,6), t = today();
  const title = `${start.toLocaleDateString(undefined,{month:"short",day:"numeric"})} – ${end.toLocaleDateString(undefined,{month:"short",day:"numeric"})}`;
  let html = `<div class="week-head"><h2>${title}</h2><div class="row-actions">
    <button class="btn" data-week="-1" aria-label="Previous week">‹ Prev</button>
    <button class="btn" data-week="0">This week</button>
    <button class="btn" data-week="1" aria-label="Next week">Next ›</button></div></div><div class="week-grid">`;
  for(let i=0;i<7;i++){
    const d = addDays(start,i), key = ymd(d);
    const sp = specialFor(d);
    const classes = sessionsOn(d);
    const items = state.items.filter(it=>it.due===key).sort((a,b)=>dueAt(a)-dueAt(b));
    const has = classes.length || items.length || sp || state.plan.blocks.some(b=>b.date===key && blockVisible(b));
    html += `<div class="day${dayDiff(d,t)===0?" today":""}${has?" has":""}"><h3><button type="button" class="day-link" data-goday="${key}" aria-label="Open ${DAYS_LONG[i]}"><span>${DAYS[i]}</span><b>${d.getDate()}</b></button></h3>`;
    if(sp) html += `<div class="slot special">${+sp.follows ? `🔁 ${esc(sp.label||"Schedule change")}<small>${DAYS_LONG[sp.follows-1]} schedule</small>` : `🏖️ ${esc(sp.label||"Day off")}<small>No classes</small>`}</div>`;
    for(const {c,s} of classes){
      html += `<div class="slot" style="--c:${c.color}"><strong>${esc(c.name)}</strong><small>${fmtTime(s.start)}–${fmtTime(s.end)}${s.room?", "+esc(s.room):""}</small></div>`;
    }
    for(const b of state.plan.blocks.filter(b=>b.date===key && blockVisible(b)).sort((x,y)=>x.start.localeCompare(y.start))){
      const it = state.items.find(i=>i.id===b.itemId);
      html += `<button type="button" class="slot study${b.done?" is-done":""}" style="--c:${it?colorOf(it):NOCLASS}" data-goday="${key}">📚 ${esc(b.title)}<small>${fmtTime(b.start)}–${fmtTime(b.end)}</small></button>`;
    }
    for(const it of items){
      const k = KINDS[it.kind]||KINDS.homework;
      html += `<button type="button" class="slot task${it.done?" is-done":""}" style="--c:${colorOf(it)}" data-edit="${it.id}">${k.icon} ${esc(it.title)}<small>${it.kind==="exam"?"Exam":"Due"}${it.time?" "+fmtTime(it.time):""}</small></button>`;
    }
    if(!has) html += `<small class="none" style="color:var(--muted)">Free</small>`;
    html += `</div>`;
  }
  return html + `</div>`;
}

function sessionSummary(c){
  const s = (c.sessions||[]).slice().sort((a,b)=>(a.day-b.day)||a.start.localeCompare(b.start));
  if(!s.length) return "No class times yet";
  return s.map(x=>`${DAYS[x.day-1]} ${fmtTime(x.start)}–${fmtTime(x.end)}${x.room?" ("+esc(x.room)+")":""}`).join(", ");
}

/* ---------- item dialog ---------- */
let editingItem = null;
function fillClassSelect(sel, val){
  sel.innerHTML = `<option value="">No class</option>` + state.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
  sel.value = val || "";
}
function setKind(kind){
  $("#itemForm").querySelectorAll('input[name=kind]').forEach(r=>r.checked = r.value===kind);
  const exam = kind==="exam";
  $("#itemForm").querySelectorAll(".exam-only").forEach(el=>el.hidden=!exam);
  $("#dateLabel").textContent = exam ? "Date" : "Due date";
}
function openItem(id){
  const f = $("#itemForm");
  const it = id ? state.items.find(i=>i.id===id) : null;
  editingItem = it;
  $("#kindPick").innerHTML = Object.entries(KINDS).map(([k,v])=>`<label><input type="radio" name="kind" value="${k}"><span>${v.icon} ${v.label}</span></label>`).join("");
  fillClassSelect($("#classSelect"), it ? it.classId : "");
  f.title.value = it ? it.title : "";
  f.due.value = it ? it.due : ymd(ui.tab==="day" && dayDiff(ui.day,today())>0 ? ui.day : addDays(today(),1));
  f.time.value = it ? (it.time||"") : "";
  f.duration.value = it ? (it.duration||120) : 120;
  f.room.value = it ? (it.room||"") : "";
  f.high.checked = it ? it.priority==="high" : false;
  f.notes.value = it ? (it.notes||"") : "";
  setKind(it ? it.kind : "homework");
  $("#itemDlgTitle").textContent = it ? "Edit" : "Add to your planner";
  $("#itemDelete").hidden = !it;
  $("#itemError").hidden = true;
  $("#itemDlg").showModal();
  if(!it && !isIOS) setTimeout(()=>f.title.focus(),30);
}
$("#kindPick").addEventListener("change",e=>{ if(e.target.name==="kind") setKind(e.target.value); });
$("#itemForm").addEventListener("submit",e=>{
  e.preventDefault();
  const f = e.target, kind = (f.querySelector('input[name=kind]:checked')||{}).value || "homework";
  const title = f.title.value.trim();
  if(!title || !f.due.value){
    const er=$("#itemError"); er.textContent = !title ? "Give it a title." : "Pick a date."; er.hidden=false; return;
  }
  const data = {kind,title,classId:f.classId.value,due:f.due.value,time:f.time.value,
    duration: kind==="exam" ? Math.max(15,+f.duration.value||120) : undefined,
    room: kind==="exam" ? f.room.value.trim() : "",
    priority: f.high.checked ? "high" : "normal", notes: f.notes.value.trim(), updatedAt: Date.now()};
  if(editingItem){ Object.assign(editingItem,data); editingItem.rev=(editingItem.rev||0)+1; toast("Saved"); }
  else { state.items.push(Object.assign({id:uid(),done:false,rev:0},data)); toast("Added"); }
  commit(); $("#itemDlg").close(); render();
});
$("#itemDelete").addEventListener("click",()=>{
  if(!editingItem || !confirm(`Delete “${editingItem.title}”?`)) return;
  state.items = state.items.filter(i=>i!==editingItem); commit(); $("#itemDlg").close(); render(); toast("Deleted");
});

$("#sessions").addEventListener("click",e=>{ if(e.target.closest("[data-remove]")) e.target.closest(".session").remove(); });
$("#classForm").addEventListener("submit",e=>{
  e.preventDefault();

  if(!name){ er.textContent="Give the class a name."; er.hidden=false; return; }
  const sessions = [...$("#sessions").querySelectorAll(".session")].map(r=>({

function b64(blob){
  return new Promise((res,rej)=>{ const r = new FileReader(); r.onload = ()=>res(String(r.result).split(",")[1]); r.onerror = ()=>rej(r.error); r.readAsDataURL(blob); });
}
async function toJpeg(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = url; });
    const max = 2400, k = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth*k), h = Math.round(img.naturalHeight*k);
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0,0,w,h); cx.drawImage(img,0,0,w,h);
    const blob = await new Promise(r=>cv.toBlob(r,"image/jpeg",0.88));
    if(!blob) throw new Error("encode");
    return blob;
  } finally { URL.revokeObjectURL(url); }
}
async function prepFile(file){
  const isPdf = file.type==="application/pdf" || /\.pdf$/i.test(file.name);
  if(isPdf){
    if(file.size > 15e6) throw userErr(`${file.name} is too big. Keep PDFs under 15 MB.`);
    return {mime:"application/pdf", data: await b64(file)};
  }
  let blob;
  try{ blob = await toJpeg(file); }
  catch(e){
    if(/^image\/(jpeg|png|webp|gif)$/.test(file.type)) blob = file;
    else throw userErr(`Couldn't open ${file.name}. Try a screenshot, JPEG or PNG instead.`);
  }
  return {mime: blob.type || "image/jpeg", data: await b64(blob)};
}

function importPrompt(){
  return `You read a student's class timetable and their school's academic calendar, and return JSON only.
Today is ${ymd(today())}. Documents may be in French (Québec cégep or university) or English. Lundi=1, Mardi=2, Mercredi=3, Jeudi=4, Vendredi=5, Samedi=6, Dimanche=7.

Return exactly this shape:
{"classes":[{"name":"","teacher":"","sessions":[{"day":1,"start":"HH:MM","end":"HH:MM","room":""}]}],
 "term":{"start":"YYYY-MM-DD or null","end":"YYYY-MM-DD or null"},
 "daysOff":[{"start":"YYYY-MM-DD","end":"YYYY-MM-DD","label":""}],
 "swapDays":[{"date":"YYYY-MM-DD","follows":1,"label":""}],
 "notes":""}

Rules:
- One entry per course. Put every weekly meeting of that course (lectures, labs, théorie, laboratoire) in its sessions. Use the course title as the name, short and readable, without the course code unless there is no title. Keep rooms (local) as written. Times in 24-hour format.
- term.start is the first day of classes and term.end the last day of classes of the semester the timetable belongs to (or the current or upcoming semester if unclear). Use null when not shown.
- daysOff: every day or range with no classes (holidays, congés, fériés, journées pédagogiques, journées d'étude, semaine de lecture, relâche). For a single day, start equals end. Only days inside or touching the semester.
- swapDays: days that follow another weekday's schedule (for example "horaire du lundi" or "Monday schedule"). follows is that weekday's number.
- Work out the year from the calendar and today's date.
- Only include what you can actually read. Do not invent anything. Use empty arrays when there is nothing.
- notes: one or two short sentences about anything you were unsure of, in the same language as the documents. Empty string if nothing.
- Output the JSON object only, with no markdown.`;
}
const groupLabel = slot => slot==="schedule" ? "The next file(s) are the student's class timetable." : "The next file(s) are the school's academic calendar.";

async function askGemini(groups, signal){
  const parts = [{text: importPrompt()}];
  for(const g of groups){ parts.push({text: groupLabel(g.slot)}); for(const p of g.parts) parts.push({inlineData:{mimeType:p.mime, data:p.data}}); }
  return callGemini(parts, signal, 0.1);
}
/** One Gemini request that must answer in JSON. Tries newer model names first. */
async function callGemini(parts, signal, temperature){
  const body = JSON.stringify({contents:[{role:"user", parts}], generationConfig:{responseMimeType:"application/json", temperature}});
  let lastErr = userErr("The AI isn't available right now. Try again later.");
  for(const model of GEMINI_MODELS){
    let res;
    try{
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(ai.key)}`,
        {method:"POST", headers:{"Content-Type":"application/json"}, body, signal});
    }catch(e){ if(e.name==="AbortError") throw e; throw userErr("No connection. Check your internet and try again."); }
    if(res.status===404) continue; // model name retired: try the next one
    const data = await res.json().catch(()=>({}));
    if(!res.ok){
      const msg = (data.error && data.error.message) || "";
      if((res.status===400 && /api.?key/i.test(msg)) || res.status===401 || res.status===403) throw userErr("Google didn't accept that key. Check it and paste it again.","key");
      if(res.status===429) throw userErr("You've reached the free limit for now. Wait a minute and try again.");
      if(res.status>=500) { lastErr = userErr("Google's AI is busy right now. Try again in a minute."); continue; }
      throw userErr(`Gemini sent back an error (${res.status}). Try again in a moment.`);
    }
    const cand = data.candidates && data.candidates[0];
    const text = cand && cand.content ? (cand.content.parts||[]).map(p=>p.text||"").join("") : "";
    if(!text) throw userErr("The AI didn't send anything back. Try again.");
    return text;
  }
  throw lastErr;
}
function parseJson(text){
  let t = String(text).replace(/```(?:json)?/gi,"");
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if(a<0 || b<a) throw userErr("The AI's answer came back garbled. Try again.");
  try{ return JSON.parse(t.slice(a,b+1)); }catch(e){ throw userErr("The AI's answer came back garbled. Try again."); }
}
function cleanResult(r){
  r = r && typeof r==="object" ? r : {};
  const str = (x,n)=>String(x ?? "").trim().slice(0,n);
  const hm = x=>{ const m = String(x ?? "").trim().match(/^(\d{1,2})\s*[:hH]\s*(\d{2})$/); if(!m) return null; const h=+m[1], mi=+m[2]; return h<24 && mi<60 ? pad(h)+":"+pad(mi) : null; };
  const dt = x=>{ const v = String(x ?? "").trim(); if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return null; const d = parseYmd(v); return ymd(d)===v ? v : null; };
  const day = x=>{ const n = Math.round(+x); return n>=1 && n<=7 ? n : null; };
  const classes = (Array.isArray(r.classes)?r.classes:[]).map(c=>({
    name: str(c && c.name, 80), teacher: str(c && c.teacher, 80),
    sessions: (Array.isArray(c && c.sessions)?c.sessions:[]).map(s=>({day:day(s&&s.day), start:hm(s&&s.start), end:hm(s&&s.end), room:str(s&&s.room,40)}))
      .filter(s=>s.day && s.start && s.end && s.end>s.start)
  })).filter(c=>c.name && c.sessions.length);
  const term = {start: dt(r.term && r.term.start), end: dt(r.term && r.term.end)};
  if(term.start && term.end && term.end < term.start) term.end = null;
  const daysOff = (Array.isArray(r.daysOff)?r.daysOff:[]).map(x=>{ let s = dt(x&&x.start), e = dt(x&&x.end) || s; if(s && e < s) [s,e] = [e,s]; return {start:s, end:e, label:str(x&&x.label,60)}; }).filter(x=>x.start);
  const swapDays = (Array.isArray(r.swapDays)?r.swapDays:[]).map(x=>({date:dt(x&&x.date), follows:day(x&&x.follows), label:str(x&&x.label,60)})).filter(x=>x.date && x.follows);
  return {classes, term, daysOff, swapDays, notes: str(r.notes, 400)};
}

async function readPhotos(){
  if(!(imp.files.schedule.length + imp.files.calendar.length)) return;
  imp.stage = "loading"; imp.error = ""; renderImport();
  const ctrl = new AbortController(); imp.abort = ctrl;
  try{
    const groups = [];
    for(const slot of ["schedule","calendar"]){
      const parts = [];
      for(const f of imp.files[slot]) parts.push(await prepFile(f.file));
      if(parts.length) groups.push({slot, parts});
    }
    const text = await askGemini(groups, ctrl.signal);
    const r = cleanResult(parseJson(text));
    if(!r.classes.length && !r.daysOff.length && !r.swapDays.length && !r.term.start && !r.term.end)
      throw userErr("The AI couldn't find a schedule in these files. Try a closer, sharper photo or a screenshot.");
    imp.result = r; imp.stage = "review";
  }catch(e){
    if(e.name==="AbortError" || ctrl.signal.aborted) return;
    imp.stage = e.code==="key" ? "setup" : "pick";
    imp.error = e.userMsg || "Something went wrong while reading the files. Try again.";
  }finally{
    if(imp.abort===ctrl) imp.abort = null;
  }
  if($("#importDlg").open) renderImport();
}

function applyImport(){
  const r = imp.result, s = state.settings, body = $("#importBody");
  const picked = k=>{ const el = body.querySelector(`[data-pick="${k}"]`); return !!(el && el.checked); };
  let added = 0, updated = 0, other = 0;
  r.classes.forEach((c,i)=>{
    if(!picked("class:"+i)) return;
    const sessions = c.sessions.map(x=>Object.assign({id:uid()}, x));
    const ex = state.classes.find(x=>normName(x.name)===normName(c.name));
    if(ex){ ex.sessions = sessions; if(c.teacher) ex.teacher = c.teacher; ex.rev = (ex.rev||0)+1; ex.updatedAt = Date.now(); updated++; }
    else {
      const used = state.classes.map(x=>x.color);
      state.classes.push({id:uid(), name:c.name, teacher:c.teacher, color: COLORS.find(x=>!used.includes(x)) || COLORS[state.classes.length % COLORS.length], sessions, rev:0, updatedAt:Date.now()});
      added++;
    }
  });
  if(picked("term")){ if(r.term.start) s.termStart = r.term.start; if(r.term.end) s.termEnd = r.term.end; other++; }
  const exists = (st,en,fo)=>state.specialDays.some(x=>x.start===st && (x.end||x.start)===en && (+x.follows||0)===fo);
  r.daysOff.forEach((x,i)=>{ if(picked("off:"+i) && !exists(x.start,x.end,0)){ state.specialDays.push({id:uid(), label:x.label, start:x.start, end:x.end, follows:0}); other++; } });
  r.swapDays.forEach((x,i)=>{ if(picked("swap:"+i) && !exists(x.date,x.date,x.follows)){ state.specialDays.push({id:uid(), label:x.label, start:x.date, end:x.date, follows:x.follows}); other++; } });
  if(!added && !updated && !other){ toast("Nothing was ticked, so nothing changed."); return; }
  s.termRev = (s.termRev||0)+1;
  commit(); $("#importDlg").close(); ui.tab = "classes"; render(); window.scrollTo({top:0});
  const bits = [];
  if(added) bits.push(`${added} class${added>1?"es":""} added`);
  if(updated) bits.push(`${updated} updated`);
  if(other) bits.push("calendar dates saved");
  toast(bits.join(", ").replace(/^./,c=>c.toUpperCase()));
}

/* =========================================================
   AI PLANNER

function plannerHtml(){

  const hrs = m=> m<60 ? `${m} min` : (m%60 ? `${Math.floor(m/60)} h ${m%60}` : `${m/60} h`);
  let h = "";
  if(pl.stage==="key"){
    h = `<p>The planner uses Google Gemini, which is free. It needs a key once.</p>
      <ol class="steps"><li>Go to <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> and sign in with a Google account.</li><li>Tap Create API key and copy it. No credit card needed.</li><li>Paste it below.</li></ol>

function readPlannerPrefs(){
  if(pl.stage!=="prefs") return true;
  const P = state.settings.planner, v = id=>$("#"+id).value;
  const next = {wdFrom:v("pWdFrom"), wdTo:v("pWdTo"), weFrom:v("pWeFrom"), weTo:v("pWeTo"), maxMin:+v("pMax"), session:+v("pSession"), horizon:+v("pHorizon"), notes:v("pNotes").trim().slice(0,600)};
  if(!next.wdFrom || !next.wdTo || next.wdTo <= next.wdFrom || !next.weFrom || !next.weTo || next.weTo <= next.weFrom){
    pl.error = "Each study window needs an end time after its start time."; renderPlanner(); return false;
  }
  Object.assign(P, next); saveLocal();
  return true;
}
function planContext(){
  const P = state.settings.planner, t = today(), now = new Date();
  const days = [], busy = [];
  for(let i=0;i<P.horizon;i++){
    const d = addDays(t,i), key = ymd(d), sp = specialFor(d);
    const free = isoDay(d)>=6 || (sp && !+sp.follows);
    const day = {date:key, weekday:DAYS_LONG[isoDay(d)-1], from: free?P.weFrom:P.wdFrom, to: free?P.weTo:P.wdTo};
    if(sp) day.note = +sp.follows ? `Follows the ${DAYS_LONG[sp.follows-1]} schedule` : `Day off: ${sp.label||"no classes"}`;
    days.push(day);
    for(const {c,s} of sessionsOn(d)) busy.push({date:key, start:s.start, end:s.end, what:"Class: "+c.name});
    for(const it of state.items) if(it.kind==="exam" && it.due===key && it.time) busy.push({date:key, start:it.time, end:fromMin(Math.min(toMin(it.time)+(+it.duration||120), 1439)), what:"Exam: "+it.title});
    // Keep sessions the student already finished on these days.
    for(const b of state.plan.blocks) if(b.date===key && b.done) busy.push({date:key, start:b.start, end:b.end, what:"Study session already done"});
  }
  const horizonEnd = addDays(t, P.horizon + 21);
  const tasks = state.items.filter(i=>!i.done && parseYmd(i.due) <= horizonEnd).sort((a,b)=>dueAt(a)-dueAt(b)).slice(0,60).map(i=>{
    const c = classById(i.classId);
    return {id:i.id, type:i.kind, title:i.title, class:c?c.name:"", due:i.due, dueTime:i.time||"", important:i.priority==="high", notes:(i.notes||"").slice(0,200)};
  });
  return {today: ymd(t), now: `${pad(now.getHours())}:${pad(now.getMinutes())}`, days, busy, tasks,
    maxMinutesPerDay:P.maxMin, sessionMinutes:P.session, studentNotes:P.notes};
}
function plannerPrompt(ctx){
  return `You are a friendly study coach. Plan study sessions for a student and return JSON only.

Make study sessions ("blocks") that:
- happen only on the days listed in DATA.days, inside that day's from/to window, and never overlap anything in DATA.busy;
- on today (${ctx.today}), start at or after ${ctx.now};
- finish before the task is due. For a deadline with no time, or at 23:59, aim to finish the day before;
- give each task a realistic total: homework or reading about 45 to 90 minutes, an assignment 2 to 5 hours, a project 4 to 10 hours, an exam 3 to 8 hours spread over several days before it. Adjust using the title, notes and importance;
- split bigger work into sessions of about ${ctx.sessionMinutes} minutes, each with a concrete focus, for example "Outline and thesis", "Problems 1 to 10", "Review chapters 3 and 4";
- put late, important and soonest work first, and spread work out instead of cramming the night before;
- total at most ${ctx.maxMinutesPerDay} minutes per day, keep at least 10 minutes between sessions, and leave free time;
- respect everything in DATA.studentNotes.
Tasks due after the planning window can get sessions too if there is room. If something can't fit, list it in "unscheduled" with a short reason.

Return exactly:
{"summary":"","blocks":[{"date":"YYYY-MM-DD","start":"HH:MM","end":"HH:MM","taskId":"","focus":""}],"unscheduled":[{"taskId":"","reason":""}]}

summary: 2 to 4 short, encouraging sentences telling the student what matters most and what to do first. Write the summary, each focus and each reason in the same language as the task titles (French if they are in French). Use 24-hour times.

DATA:
${JSON.stringify(ctx)}`;
}
function cleanPlan(r, ctx){
  r = r && typeof r==="object" ? r : {};
  const hm = x=>{ const m = String(x ?? "").trim().match(/^(\d{1,2})\s*[:hH]\s*(\d{2})$/); if(!m) return null; const h=+m[1], mi=+m[2]; return h<24 && mi<60 ? pad(h)+":"+pad(mi) : null; };
  const days = new Map(ctx.days.map(d=>[d.date,d]));
  const tasks = new Map(state.items.filter(i=>!i.done).map(i=>[i.id,i]));
  const busy = {}; ctx.busy.forEach(b=>(busy[b.date] = busy[b.date] || []).push(b));
  const overlaps = (list, b)=>(list||[]).some(x=>b.start < x.end && x.start < b.end);
  const perDay = {}, out = [];
  const raw = (Array.isArray(r.blocks)?r.blocks:[]).map(b=>({date:String(b&&b.date||"").trim(), start:hm(b&&b.start), end:hm(b&&b.end), taskId:String(b&&b.taskId||""), focus:String(b&&b.focus||"").trim().slice(0,90)}))
    .filter(b=>days.has(b.date) && b.start && b.end && b.end > b.start && tasks.has(b.taskId))
    .sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  for(const b of raw){
    const day = days.get(b.date), it = tasks.get(b.taskId);
    if(b.start < day.from || b.end > day.to) continue;
    if(b.date===ctx.today && b.start < ctx.now) continue;
    if(`${b.date} ${b.end}` > `${it.due} ${it.time||"23:59"}`) continue;
    if(overlaps(busy[b.date], b) || overlaps(out.filter(x=>x.date===b.date), b)) continue;
    const mins = toMin(b.end) - toMin(b.start);
    if((perDay[b.date]||0) + mins > ctx.maxMinutesPerDay + 15) continue;
    perDay[b.date] = (perDay[b.date]||0) + mins;
    out.push(b);
  }
  const unscheduled = (Array.isArray(r.unscheduled)?r.unscheduled:[]).map(u=>({taskId:String(u&&u.taskId||""), reason:String(u&&u.reason||"").trim().slice(0,120)})).filter(u=>tasks.has(u.taskId));
  return {summary:String(r.summary||"").trim().slice(0,600), blocks:out, unscheduled};
}
async function makePlan(){
  if(!readPlannerPrefs()) return;
  pl.stage = "loading"; pl.error = ""; renderPlanner();
  const ctrl = new AbortController(); pl.abort = ctrl;
  try{
    const ctx = planContext();
    const text = await callGemini([{text: plannerPrompt(ctx)}], ctrl.signal, 0.4);
    pl.result = cleanPlan(parseJson(text), ctx); pl.ctx = ctx; pl.stage = "review";
  }catch(e){
    if(e.name==="AbortError" || ctrl.signal.aborted) return;
    pl.stage = e.code==="key" ? "key" : "prefs";
    pl.error = e.userMsg || "Something went wrong making your plan. Try again.";
  }finally{
    if(pl.abort===ctrl) pl.abort = null;
  }
  renderPlanner();
}
function savePlan(){
  const r = pl.result, tk = ymd(today()), oldest = ymd(addDays(today(),-30));
  // Keep the past and finished sessions; replace everything still ahead.
  const keep = state.plan.blocks.filter(b=>b.date >= oldest && (b.date < tk || b.done));
  const fresh = r.blocks.map(b=>{ const it = state.items.find(i=>i.id===b.taskId); return {id:uid(), date:b.date, start:b.start, end:b.end, itemId:b.taskId, title: it?it.title:"Study", focus:b.focus, done:false}; });
  state.plan = {createdAt: Date.now(), summary: r.summary, blocks: keep.concat(fresh)};
  commit(); pl.stage = "overview"; pl.result = null;
  ui.tab = "ai"; render(); window.scrollTo({top:0});
  toast("Plan saved" + (connected() && state.settings.incStudy ? ". It's on its way to Apple Calendar too." : "."));
}

/* =========================================================
   SHARING WITH FRIENDS
   Selected deadlines and exams are packed into the link itself
   (after #share=), compressed. Nothing goes through a server.
   ========================================================= */
const b64u = bytes=>{ let s = ""; for(let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
const unb64u = str=>{ str = str.replace(/-/g,"+").replace(/_/g,"/"); while(str.length%4) str += "="; const bin = atob(str); const out = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i); return out; };
async function packShare(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream !== "undefined"){
    try{ const out = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer()); return "z"+b64u(out); }catch(e){}
  }
  return "j"+b64u(bytes);
}
async function unpackShare(code){
  const kind = code[0]; let raw = unb64u(code.slice(1));
  if(kind==="z"){
    if(typeof DecompressionStream === "undefined") throw userErr("This device is too old to open shared items. Update iOS or your browser, then try again.");
    raw = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  } else if(kind!=="j") throw new Error("bad");
  return JSON.parse(new TextDecoder().decode(raw));
}
const appAddress = ()=>location.origin + location.pathname.replace(/index\.html$/,"");

async function shareSelected(){
  const items = state.items.filter(i=>ui.selected.has(i.id));
  if(!items.length){ toast("Select at least one item."); return; }
  const classes = [], idx = {};
  const payload = {v:1, items: items.map(i=>{
    const c = classById(i.classId); let ci = -1;
    if(c){ if(!(c.id in idx)){ idx[c.id] = classes.length; classes.push({n:c.name, c:c.color}); } ci = idx[c.id]; }
    const o = {k:i.kind, t:i.title, d:i.due};
    if(i.time) o.tm = i.time; if(i.kind==="exam"){ o.du = +i.duration||120; if(i.room) o.r = i.room; }
    if(i.notes) o.n = i.notes; if(i.priority==="high") o.p = 1; if(ci>=0) o.c = ci;
    return o;
  })};
  payload.classes = classes;
  const url = appAddress() + "#share=" + await packShare(payload);
  const what = items.length===1 ? `“${items[0].title}”` : `${items.length} deadlines and exams`;
  const text = `${what} from my Study Planner. Open the link, or copy it and paste it in the app (Due tab, Add from a friend).`;
  if(navigator.share){
    try{ await navigator.share({title:"Study Planner", text, url}); }catch(e){ if(e && e.name==="AbortError") return; }
  } else {
    try{ await navigator.clipboard.writeText(url); toast("Link copied. Send it to your friend."); }
    catch(e){ prompt("Send this link to your friend:", url); }
  }
  ui.selecting = false; ui.selected.clear(); render();
}

const sh = {stage:"paste", result:null, error:"", fromLink:false, link:""};
function openShared(code, fromLink, link){

async function loadShared(code){
