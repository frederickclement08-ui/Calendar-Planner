    sh.result = r; sh.stage = "review"; sh.error = "";
  }catch(e){
    sh.stage = "paste"; sh.error = e.userMsg || "That link doesn't work. Ask your friend to share it again.";
  }
  renderShared();
}
function cleanShared(p){
  p = p && typeof p==="object" ? p : {};
  const classes = (Array.isArray(p.classes)?p.classes:[]).slice(0,40).map(c=>({name:String(c&&c.n||"").trim().slice(0,80), color: /^#[0-9a-f]{6}$/i.test(c&&c.c) ? c.c : COLORS[0]}));
  const hm = x=>/^\d{2}:\d{2}$/.test(String(x||"")) ? String(x) : "";
  const items = (Array.isArray(p.items)?p.items:[]).slice(0,200).map(o=>({
    kind: KINDS[o&&o.k] ? o.k : "homework", title:String(o&&o.t||"").trim().slice(0,120),
    due: /^\d{4}-\d{2}-\d{2}$/.test(String(o&&o.d||"")) ? o.d : "", time: hm(o&&o.tm),
    duration: Math.max(15, Math.min(600, +(o&&o.du)||120)), room:String(o&&o.r||"").slice(0,40),
    notes:String(o&&o.n||"").slice(0,1000), priority: o&&o.p ? "high" : "normal",
    cls: Number.isInteger(o&&o.c) && classes[o.c] ? classes[o.c] : null
  })).filter(i=>i.title && i.due);
  return {items};
}
function renderShared(){
  const body = $("#sharedBody"); let h = "";
  if(sh.stage==="paste"){
    h = `<p>Paste the link your friend sent you.</p>
      <label class="field"><span>Link</span><textarea id="sharedPaste" placeholder="https://…#share=…" spellcheck="false" autocapitalize="off"></textarea></label>
      ${sh.error?`<p class="error">${esc(sh.error)}</p>`:""}
      <div class="foot"><div class="right"><button type="button" class="btn ghost" data-sh="close">Cancel</button><button type="button" class="btn primary" data-sh="read">Continue</button></div></div>`;
  } else {
    const r = sh.result;
    const dup = i=>state.items.some(x=>normName(x.title)===normName(i.title) && x.due===i.due && x.kind===i.kind);
    h = (sh.fromLink && isIOS && !isStandalone ? `<p class="ai-note">Using Study Planner from your Home Screen? It keeps its own copy of your planner, so add these there: copy this link, open the app, then tap Due, Add from a friend. <button type="button" class="linkbtn" data-sh="copy-link">Copy link</button></p>` : "")
      + `<p>Your friend shared ${r.items.length===1?"this":"these"} with you. Untick anything you don't want.</p><div class="review">`
      + r.items.map((i,n)=>{
        const isDup = dup(i), k = KINDS[i.kind];
        const newCls = i.cls && !state.classes.some(c=>normName(c.name)===normName(i.cls.name));
        return `<label class="pick"><input type="checkbox" data-shpick="${n}" ${isDup?"":"checked"}><span><b>${k.icon} ${esc(i.title)}</b>${isDup?'<span class="tag">already in your planner</span>':""}${newCls?`<span class="tag">new class</span>`:""}
          <small>${i.cls?esc(i.cls.name)+" — ":""}${k.label}, ${fmtDate(parseYmd(i.due))}${i.time?", "+fmtTime(i.time):""}</small></span></label>`;
      }).join("") + `</div>
      <div class="foot"><div class="right"><button type="button" class="btn ghost" data-sh="close">Cancel</button><button type="button" class="btn primary" data-sh="add">Add to my planner</button></div></div>`;
  }
  body.innerHTML = h;
}
$("#sharedBody").addEventListener("click", async e=>{
  const b = e.target.closest("[data-sh]"); if(!b) return;
  const a = b.dataset.sh;
  if(a==="close") $("#sharedDlg").close();
  else if(a==="read"){
    const v = ($("#sharedPaste").value||"").trim();
    const m = v.match(/#share=([A-Za-z0-9_-]+)/) || v.match(/^([zj][A-Za-z0-9_-]{8,})$/);
    if(!m){ sh.error = "That doesn't look like a Study Planner link."; renderShared(); return; }
    loadShared(m[1]);
  }
  else if(a==="copy-link"){ try{ await navigator.clipboard.writeText(sh.link); toast("Link copied"); }catch(err){ prompt("Copy this link:", sh.link); } }
  else if(a==="add"){
    const r = sh.result, picked = r.items.filter((_,n)=>{ const el = $("#sharedBody").querySelector(`[data-shpick="${n}"]`); return el && el.checked; });
    if(!picked.length){ toast("Nothing ticked, so nothing was added."); return; }
    let newClasses = 0;
    for(const i of picked){
      let classId = "";
      if(i.cls){
        let c = state.classes.find(x=>normName(x.name)===normName(i.cls.name));
        if(!c){
          const used = state.classes.map(x=>x.color);
          c = {id:uid(), name:i.cls.name, teacher:"", color: used.includes(i.cls.color) ? (COLORS.find(x=>!used.includes(x)) || i.cls.color) : i.cls.color, sessions:[], rev:0, updatedAt:Date.now()};
          state.classes.push(c); newClasses++;
        }
        classId = c.id;
      }
      state.items.push({id:uid(), kind:i.kind, title:i.title, classId, due:i.due, time:i.time,
        duration: i.kind==="exam" ? i.duration : undefined, room: i.kind==="exam" ? i.room : "",
        priority:i.priority, notes:i.notes, done:false, rev:0, updatedAt:Date.now()});
    }
    commit(); $("#sharedDlg").close(); ui.tab = "agenda"; render(); window.scrollTo({top:0});
    toast(`Added ${picked.length} item${picked.length>1?"s":""}` + (newClasses?`. Add class times for the new class${newClasses>1?"es":""} in Classes.`:"."));
  }
});
function checkShareHash(){
  const m = location.hash.match(/^#share=([A-Za-z0-9_-]+)/);
  if(!m) return;
  const link = location.href;
  history.replaceState(null, "", location.pathname + location.search);
  openShared(m[1], true, link);
}
window.addEventListener("hashchange", checkShareHash);

/* ---------- calendar feed (.ics) ---------- */
function icsEsc(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
const compact = d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
const localStamp = d=>`${compact(d)}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
const utcStamp = d=>d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
function fold(line){
  const enc = new TextEncoder(); const parts=[]; let cur="", n=0, limit=75;
  for(const ch of line){ const b=enc.encode(ch).length; if(n+b>limit){ parts.push(cur); cur=""; n=0; limit=74; } cur+=ch; n+=b; }
  parts.push(cur); return parts.join("\r\n ");
}
function alarm(summary, trigger){ return ["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(summary),"TRIGGER:"+trigger,"END:VALARM"]; }

function itemEvent(it, stamp){
  const s = state.settings, c = classById(it.classId), k = KINDS[it.kind]||KINDS.homework;
  const isExam = it.kind==="exam";
  const summary = `${k.icon} ${isExam?"":"Due: "}${it.title}${c?" ("+c.name+")":""}`;
  const L = ["BEGIN:VEVENT",`UID:${it.id}@study-planner`,`DTSTAMP:${stamp}`,`SEQUENCE:${it.rev||0}`];
  const d = parseYmd(it.due);
  const rem = +(isExam ? s.remindExam : s.remindTask) || 0;
  let trigger = null;
  if(it.time){
    const start = withTime(d,it.time);
    const mins = isExam ? (+it.duration||120) : 0; // deadlines sit exactly at the due time
    L.push("DTSTART:"+localStamp(start), "DTEND:"+localStamp(new Date(start.getTime()+mins*6e4)));
    if(rem) trigger = `-PT${rem}M`;
  } else {
    L.push("DTSTART;VALUE=DATE:"+compact(d), "DTEND;VALUE=DATE:"+compact(addDays(d,1)), "TRANSP:TRANSPARENT");
    if(rem) trigger = rem>=1440 ? `-PT${(rem/1440)*24-9}H` : "PT9H"; // 9 AM the day(s) before, or 9 AM same day
  }
  L.push("SUMMARY:"+icsEsc(summary));
  const desc = [k.label + (c?` for ${c.name}`:""), it.priority==="high"?"Marked important":"", it.notes||""].filter(Boolean).join("\n");
  L.push("DESCRIPTION:"+icsEsc(desc));
  if(isExam && it.room) L.push("LOCATION:"+icsEsc(it.room));
  if(it.priority==="high") L.push("PRIORITY:1");
  if(trigger) L.push(...alarm(summary,trigger));
  L.push("END:VEVENT");
  return L;
}
function termRange(){
  const s = state.settings;
  const start = s.termStart ? parseYmd(s.termStart) : mondayOf(today());
  const end = s.termEnd ? parseYmd(s.termEnd) : addDays(start, 7*15);
  return {start,end};
}
function classEvents(c, stamp, term){
  const s = state.settings, out = [];
  for(const se of (c.sessions||[])){
    let first = new Date(term.start);
    while(isoDay(first)!==+se.day) first = addDays(first,1);
    if(first > term.end) continue;
    const L = ["BEGIN:VEVENT",`UID:${c.id}-${se.id}@study-planner`,`DTSTAMP:${stamp}`,`SEQUENCE:${(c.rev||0)+(s.termRev||0)}`,
      "DTSTART:"+localStamp(withTime(first,se.start)), "DTEND:"+localStamp(withTime(first,se.end)),
      `RRULE:FREQ=WEEKLY;UNTIL=${compact(term.end)}T235959`, "SUMMARY:"+icsEsc(c.name)];
    const skip = [];
    for(let d = new Date(first); d <= term.end; d = addDays(d,7)) if(specialFor(d)) skip.push(localStamp(withTime(d,se.start)));
    if(skip.length) L.push("EXDATE:"+skip.join(","));
    if(se.room) L.push("LOCATION:"+icsEsc(se.room));
    if(c.teacher) L.push("DESCRIPTION:"+icsEsc("Teacher: "+c.teacher));
    if(+s.remindClass) L.push(...alarm(c.name, `-PT${+s.remindClass}M`));
    L.push("END:VEVENT");
    out.push(L);
  }
  return out;
}
/** Days that follow another weekday's schedule get that weekday's classes. */
function swapEvents(stamp, term){
  const s = state.settings, out = [];
  for(const sp of state.specialDays){
    if(!+sp.follows) continue;
    const d = parseYmd(sp.start);
    if(d < term.start || d > term.end) continue;
    for(const c of state.classes) for(const se of (c.sessions||[])) if(+se.day===+sp.follows){
      const L = ["BEGIN:VEVENT",`UID:${c.id}-${se.id}-${compact(d)}@study-planner`,`DTSTAMP:${stamp}`,`SEQUENCE:${(c.rev||0)+(s.termRev||0)}`,
        "DTSTART:"+localStamp(withTime(d,se.start)), "DTEND:"+localStamp(withTime(d,se.end)), "SUMMARY:"+icsEsc(c.name),
        "DESCRIPTION:"+icsEsc(`${sp.label||"Schedule change"}: ${DAYS_LONG[sp.follows-1]} schedule`)];
      if(se.room) L.push("LOCATION:"+icsEsc(se.room));
      if(+s.remindClass) L.push(...alarm(c.name, `-PT${+s.remindClass}M`));
      L.push("END:VEVENT"); out.push(L);
    }
  }
  return out;
}
/** An all-day marker for each day off or schedule change. */
function specialEvents(stamp){
  return state.specialDays.map(sp=>{
    const d = parseYmd(sp.start), e = parseYmd(sp.end||sp.start);
    const sum = +sp.follows ? `🔁 ${sp.label||"Schedule change"} (${DAYS_LONG[sp.follows-1]} schedule)` : `🏖️ ${sp.label||"Day off"}`;
    return ["BEGIN:VEVENT",`UID:${sp.id}@study-planner`,`DTSTAMP:${stamp}`,`SEQUENCE:${state.settings.termRev||0}`,
      "DTSTART;VALUE=DATE:"+compact(d), "DTEND;VALUE=DATE:"+compact(addDays(e,1)), "TRANSP:TRANSPARENT", "SUMMARY:"+icsEsc(sum), "END:VEVENT"];
  });
}
/** Study sessions from the AI planner. */
function studyEvents(stamp){
  const s = state.settings, tk = ymd(today());
  return state.plan.blocks.filter(blockVisible).map(b=>{
    const it = state.items.find(i=>i.id===b.itemId), c = it && classById(it.classId), d = parseYmd(b.date);
    const sum = `📚 ${b.title}${c?" ("+c.name+")":""}`;
    const L = ["BEGIN:VEVENT",`UID:${b.id}@study-planner`,`DTSTAMP:${stamp}`,
      "DTSTART:"+localStamp(withTime(d,b.start)), "DTEND:"+localStamp(withTime(d,b.end)),
      "SUMMARY:"+icsEsc(sum), "DESCRIPTION:"+icsEsc(b.focus || "Study session")];
    if(+s.remindStudy && !b.done && b.date >= tk) L.push(...alarm(sum, `-PT${+s.remindStudy}M`));
    L.push("END:VEVENT");
    return L;
  });
}
/** The whole calendar as it should look right now. */
function buildFeed(){
  const s = state.settings, stamp = utcStamp(new Date());
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Study Planner//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "X-WR-CALNAME:School","X-WR-CALDESC:Deadlines\\, exams and classes from Study Planner",
    "REFRESH-INTERVAL;VALUE=DURATION:PT15M","X-PUBLISHED-TTL:PT15M"];
  for(const it of state.items){
    if(it.done) continue;
    if(it.kind==="exam" ? !s.incExams : !s.incTasks) continue;
    lines.push(...itemEvent(it, stamp));
  }
  if(s.incClasses){
    const term = termRange();
    for(const c of state.classes) classEvents(c, stamp, term).forEach(e=>lines.push(...e));
    swapEvents(stamp, term).forEach(e=>lines.push(...e));
    specialEvents(stamp).forEach(e=>lines.push(...e));
  }
  if(s.incStudy) studyEvents(stamp).forEach(e=>lines.push(...e));
  lines.push("END:VCALENDAR");
  return lines.map(fold).join("\r\n") + "\r\n";
}
function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text],{type}));
  const a = document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}

  ];
  commit(); render(); toast("Example data loaded. Erase it any time from Settings.");
}

$("#syncChip").addEventListener("click",()=>{ ui.tab="sync"; render(); window.scrollTo({top:0}); });
$("#fab").addEventListener("click",()=>{ if(ui.tab==="classes") openClass(); else openItem(); });

$("#view").addEventListener("click",async e=>{
  const t = e.target;
  const edit = t.closest("[data-edit]"); if(edit){ openItem(edit.dataset.edit); return; }
  const ec = t.closest("[data-editclass]"); if(ec){ openClass(ec.dataset.editclass); return; }
  const es = t.closest("[data-editspecial]"); if(es){ openSpecial(es.dataset.editspecial); return; }
  const ts = t.closest("[data-theme-set]"); if(ts){ setTheme(ts.dataset.themeSet); return; }
  const mv = t.closest("[data-move]"); if(mv){ moveTab(mv.dataset.move, +mv.dataset.dir); const again = $(`[data-move="${mv.dataset.move}"][data-dir="${mv.dataset.dir}"]`); if(again && !again.disabled) again.focus(); return; }
  const gt = t.closest("[data-goto]"); if(gt){ ui.tab = gt.dataset.goto; render(); window.scrollTo({top:0}); return; }
  const mo = t.closest("[data-month]");
  if(mo){ const n = +mo.dataset.month; ui.month = n===0 ? new Date(today().getFullYear(), today().getMonth(), 1) : new Date(ui.month.getFullYear(), ui.month.getMonth()+n, 1); render(); return; }
  const st = t.closest("[data-selecttoggle]");
  if(st){ const id = st.dataset.selecttoggle; ui.selected.has(id) ? ui.selected.delete(id) : ui.selected.add(id); render(); return; }
  const dj = t.closest("[data-dayjump]");
  if(dj){ const n = +dj.dataset.dayjump; ui.day = n===0 ? today() : addDays(ui.day, n); render(); return; }
  const gd = t.closest("[data-goday]"); if(gd){ ui.day = parseYmd(gd.dataset.goday); ui.tab = "day"; render(); window.scrollTo({top:0}); return; }
  const bd = t.closest("[data-blockdel]");
  if(bd){ state.plan.blocks = state.plan.blocks.filter(x=>x.id!==bd.dataset.blockdel); commit(); render(); toast("Study session removed"); return; }
  const fil = t.closest("[data-filter]"); if(fil){ ui.filter = fil.dataset.filter; render(); return; }
  const wk = t.closest("[data-week]");
  if(wk){ const n=+wk.dataset.week; ui.weekStart = n===0 ? mondayOf(today()) : addDays(ui.weekStart,7*n); render(); return; }
  const act = t.closest("[data-action]"); if(!act) return;
  const a = act.dataset.action;
  if(a==="add-class") openClass();
  else if(a==="import") openImport();
  else if(a==="plan") openPlanner();
  else if(a==="add-item") openItem();
  else if(a==="reset-order"){ state.settings.tabOrder = TAB_KEYS.slice(); commit(); render(); toast("Pages back in the original order"); }
  else if(a==="sel-start"){ ui.selecting = true; ui.selected.clear(); render(); }
  else if(a==="sel-cancel"){ ui.selecting = false; ui.selected.clear(); render(); }
  else if(a==="sel-share") shareSelected();
  else if(a==="from-friend") openShared(null, false);
  else if(a==="share"){
    const url = location.origin + location.pathname.replace(/index\.html$/,"");
    const data = {title:"Study Planner", text:"A free planner for homework, exams and classes. It syncs with Apple Calendar, and its AI reads your timetable and plans your study time.", url};
    if(navigator.share){ try{ await navigator.share(data); }catch(err){} }
    else { try{ await navigator.clipboard.writeText(url); toast("Link copied. Send it to your friends."); }catch(err){ prompt("Send this link to your friends:", url); } }
  }
  else if(a==="add-special") openSpecial();
  else if(a==="sample") loadSample();
  else if(a==="goto-sync"){ ui.tab="sync"; render(); window.scrollTo({top:0}); }
  else if(a==="hide-banner"){ try{ localStorage.setItem(BANNER_KEY,"1"); }catch(err){} render(); }
  else if(a==="connect") connect($("#tokenInput").value, false);
  else if(a==="update-key") connect($("#tokenInput").value, true);
  else if(a==="disconnect") disconnect();
  else if(a==="sync-now"){ sync.dirty = true; sync.dirtyAt = Date.now(); saveSync(); await push(); if(syncUi.s==="ok") toast("Synced"); }
  else if(a==="copy-address"){
    const addr = location.origin + location.pathname.replace(/index\.html$/,"");
    try{ await navigator.clipboard.writeText(addr); toast("Address copied"); }catch(err){ prompt("The planner's address:", addr); }
  }
  else if(a==="copy-token"){
    try{ await navigator.clipboard.writeText(sync.token); toast("GitHub key copied. Paste it in Settings on your other device."); }
    catch(err){ prompt("Your GitHub key (keep it private):", sync.token); }
  }
  else if(a==="copy-feed"){
    try{ await navigator.clipboard.writeText(feedUrl().replace(/^https:/,"webcal:")); toast("Calendar link copied"); }
    catch(err){ prompt("Copy this calendar link:", feedUrl().replace(/^https:/,"webcal:")); }
  }
  else if(a==="export") download(`school-calendar-${ymd(new Date())}.ics`, buildFeed(), "text/calendar;charset=utf-8");
  else if(a==="backup"){ download(`study-planner-backup-${ymd(new Date())}.json`, JSON.stringify(state,null,2), "application/json"); toast("Backup saved"); }
  else if(a==="restore") $("#restoreInput").click();
  else if(a==="erase"){
    if(confirm("Erase all classes, deadlines and settings?" + (connected()?" Your synced calendar will empty too.":"") + " This can't be undone.")){
      state = blank(); commit(); ui.tab="day"; ui.day = today(); render(); toast("Everything erased");
    }
  }
});
$("#view").addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.id==="tokenInput"){ e.preventDefault(); connect(e.target.value, !!sync.needsKey && !!sync.gistId); }
});
$("#view").addEventListener("change",e=>{
  const t = e.target, s = state.settings;
  if(t.matches("[data-done]")){
    const it = state.items.find(i=>i.id===t.dataset.done);
    if(it){ it.done = t.checked; it.updatedAt = Date.now(); commit(); render(); toast(it.done ? "Nice. Checked off." : "Moved back to your list"); }
    return;
  }
  if(t.id==="termStart"||t.id==="termEnd"){ s[t.id] = t.value; s.termRev = (s.termRev||0)+1; commit(); toast("Semester dates saved"); return; }
  if(["incTasks","incExams","incClasses","incStudy"].includes(t.id)){ s[t.id] = t.checked; commit(); return; }
  if(["remindTask","remindExam","remindClass","remindStudy"].includes(t.id)){ s[t.id] = +t.value; commit(); return; }
  if(t.matches("[data-select]")){
    const id = t.dataset.select; t.checked ? ui.selected.add(id) : ui.selected.delete(id); render(); return;
  }
  if(t.matches("[data-blockdone]")){
    const b = state.plan.blocks.find(x=>x.id===t.dataset.blockdone);
    if(b){ b.done = t.checked; commit(); render(); if(b.done) toast("Nice work."); }
    return;
  }
});
$("#restoreInput").addEventListener("change",e=>{
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.classes) || !Array.isArray(d.items)) throw new Error("bad");
      if(!confirm("Replace what's here with this backup?")) return;
      state = normalize(d); commit(); render(); toast("Backup restored");
    }catch(err){ toast("That file isn't a Study Planner backup."); }
    e.target.value = "";
  };
  r.readAsText(file);
});
document.addEventListener("keydown",e=>{
  if(e.key==="n" && !e.metaKey && !e.ctrlKey && !document.querySelector("dialog[open]") && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
    e.preventDefault(); ui.tab==="classes" ? openClass() : openItem();
  }
});

// Keep in step with other devices and the clock.
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){ if(!document.querySelector("dialog[open]")) render(); pull(); }
  else if(sync.dirty){ clearTimeout(pushTimer); push(); }
});
window.addEventListener("online",()=>{ sync.dirty ? push() : pull(); });
setInterval(()=>{ if(document.visibilityState==="visible" && !document.querySelector("dialog[open]")){ render(); pull(); } }, 5*60*1000);

if("serviceWorker" in navigator && window.isSecureContext && location.protocol!=="file:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

applyTheme();
render();
if(connected()) pull();
checkShareHash();
})();

</script>
</body>
</html>
